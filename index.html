<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBHWC Midnight Mastery - Full Study Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; 
            color: #f1f5f9;
            min-height: 100vh;
        }

        .category-tag {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 9999px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cat-1 { background-color: #064e3b; color: #6ee7b7; border: 1px solid #10b981; } /* Presence */
        .cat-2 { background-color: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; } /* Behavior */
        .cat-3 { background-color: #78350f; color: #fcd34d; border: 1px solid #f59e0b; } /* Skills */
        .cat-4 { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; } /* Ethics */
        .cat-5 { background-color: #4c1d95; color: #c4b5fd; border: 1px solid #8b5cf6; } /* Science */

        .case-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #0f172a;
            border: 1px solid #1e293b;
        }
        .case-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: #334155;
            background-color: #1e293b;
        }
        .case-card.solved-correct { border-left: 4px solid #10b981; }
        .case-card.solved-wrong { border-left: 4px solid #ef4444; }

        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: #1e293b;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }

        .option-item {
            cursor: pointer;
            border: 2px solid #1e293b;
            background: #0f172a;
            transition: all 0.2s;
        }
        .option-item:hover { border-color: #3b82f6; background: #1e293b; }
        .option-item.correct { border-color: #10b981; background: #064e3b; color: #d1fae5; }
        .option-item.wrong { border-color: #ef4444; background: #7f1d1d; color: #fee2e2; }
        .option-item.disabled { pointer-events: none; }

        .mastery-pill {
            font-size: 0.7rem;
            padding: 4px 12px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-10">
            <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6">
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tighter uppercase">Midnight <span class="text-blue-500">Mastery</span></h1>
                    <p class="text-slate-400 mt-1 font-medium italic">NBHWC Certification Simulator • Full 75-Scenario Set</p>
                </div>
                
                <div class="flex flex-wrap gap-3">
                    <div class="mastery-pill shadow-lg">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span class="text-slate-400">Mastered: <b id="stat-correct" class="text-emerald-400">0</b></span>
                    </div>
                    <div class="mastery-pill shadow-lg">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        <span class="text-slate-400">Accuracy: <b id="stat-accuracy" class="text-blue-400">0%</b></span>
                    </div>
                    <button onclick="resetStats()" class="text-[10px] text-slate-500 hover:text-rose-500 font-bold uppercase tracking-widest border border-slate-800 px-3 py-1 rounded-md transition-all">Reset Stats</button>
                </div>
            </div>

            <div class="mt-8 grid grid-cols-1 md:grid-cols-5 gap-4">
                <div class="col-span-1 md:col-span-2 bg-slate-900/50 p-5 rounded-2xl border border-slate-800 shadow-xl">
                    <div class="flex justify-between text-xs mb-3">
                        <span class="font-bold text-slate-500 uppercase tracking-widest">Exam Completion</span>
                        <span id="progress-text" class="text-emerald-400 font-bold">0/75</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
                <div id="category-mastery" class="col-span-1 md:col-span-3 flex gap-2 overflow-x-auto pb-2 no-scrollbar scroll-smooth">
                    <!-- Category status -->
                </div>
            </div>
        </header>

        <!-- Tools & Search -->
        <div class="sticky top-4 z-40 bg-slate-900/80 backdrop-blur-xl p-4 rounded-2xl shadow-2xl border border-slate-800 mb-8 flex flex-col md:flex-row gap-4 items-center">
            <div class="relative w-full md:w-1/3">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="search-input" placeholder="Keyword search in scenarios..." 
                       class="block w-full pl-12 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none transition-all text-sm text-slate-200">
            </div>
            
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto no-scrollbar">
                <button onclick="filterCases(0)" class="filter-btn active whitespace-nowrap bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest">All Pools</button>
                <button onclick="filterCases(1)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Presence</button>
                <button onclick="filterCases(2)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Behavior</button>
                <button onclick="filterCases(3)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Skills</button>
                <button onclick="filterCases(4)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Ethics</button>
                <button onclick="filterCases(5)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Science</button>
            </div>

            <div class="ml-auto flex items-center">
                <button onclick="shuffleBoard()" class="flex items-center gap-2 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-emerald-600 hover:text-white transition-all shadow-lg shadow-emerald-900/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Shuffle Board
                </button>
            </div>
        </div>

        <div id="case-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20"></div>
    </div>

    <!-- Case Modal -->
    <div id="case-modal" class="modal-overlay">
        <div class="bg-slate-900 rounded-[2.5rem] shadow-2xl max-w-3xl w-full max-h-[95vh] overflow-y-auto relative border border-slate-800">
            <button onclick="closeModal()" class="fixed md:absolute top-4 right-4 p-3 bg-slate-800 rounded-full text-slate-400 hover:text-white z-50 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="p-8 md:p-14">
                <div class="flex items-center gap-3 mb-6">
                    <div id="modal-category" class="category-tag">Category</div>
                    <span id="modal-id" class="text-xs font-mono text-slate-600 tracking-tighter">Case ID: --</span>
                </div>
                
                <div id="modal-title" class="text-lg md:text-xl text-slate-200 mb-10 leading-relaxed font-medium bg-slate-950 p-8 rounded-3xl border border-slate-800 shadow-inner whitespace-pre-line">
                    <!-- Full Scenario Text -->
                </div>
                
                <div id="options-container" class="space-y-4 mb-12"></div>

                <div id="feedback-section" class="hidden">
                    <div class="p-8 bg-blue-600/10 rounded-3xl border border-blue-600/30">
                        <div class="flex items-center gap-3 mb-4">
                            <svg class="w-6 h-6 text-blue-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                            <h4 class="text-xs font-black uppercase tracking-[0.2em] text-blue-400">Board Logic Explanation</h4>
                        </div>
                        <p id="explanation-text" class="text-slate-300 leading-relaxed text-sm md:text-base"></p>
                    </div>
                    <button onclick="closeModal()" class="mt-8 w-full bg-emerald-600 text-white py-5 rounded-3xl font-black text-xl hover:bg-emerald-500 uppercase tracking-widest">Next Challenge</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // FULL 75 QUESTION DATASET - UNIFIED AND VERBATIM
        const nbhwcDataset = [
            { id: 1, cat: 3, title: "Stroke Risk & Affirmation", text: "A 52-year-old man meets with the coach at the company’s on-site wellness clinic for the second session to increase the level of exercise and reduce stress in order to lower the blood pressure. The client says the client is very concerned that if the client does not get the blood pressure in check, the client may end up having a stroke like the client's father. The client appears to be upset. Which of the following is the most appropriate next step by the coach?", options: ["Affirm the client for being proactive", "Provide a positive reframe", "Suggest meditation to reduce stress", "Use appropriate silence"], answer: 0, explanation: "Affirming client’s behaviors builds confidence and self-efficacy." },
            { id: 2, cat: 1, title: "Breast Cancer Discovery", text: "A 60-year-old woman meets with the coach via videoconferencing for the first session. The client was recently diagnosed with breast cancer and was referred to the coach by the cancer support group coordinator. The client is interested in implementing healthy lifestyle changes. A section of their conversation is shown:\n\nClient: I am sure you have heard cancer stories over and over again.\nCoach: Many survivors do share similar experiences and feelings when they learn they have cancer.\nClient: Yes, and I do not want to bore you with all the sad details.\nCoach: You are concerned I have already heard it all before. Your story is important. What did it feel like to learn you have cancer?\n\nWhich technique best describes the coach’s response?", options: ["Affirming the client’s emotional state", "Assessing resilience", "Demonstrating curiosity without assumptions", "Redirecting focus", "Shifting perspective"], answer: 2, explanation: "Coach uses a 'not-knowing' mindset: getting curious and supporting the client as the expert." },
            { id: 3, cat: 1, title: "Relapse Concerns", text: "A 38-year-old woman speaks with the coach on the phone for the first session to discuss healthy behaviors. The client completed chemotherapy and radiation therapy for breast cancer and is now in remission. The client tells the coach that the client is concerned about a relapse and wants to integrate new healthy behaviors into daily routines, including cardiovascular exercise, strength training, sleeping at least 7 hours nightly, stress management, and having fun with friends again. Which is the most appropriate response?", options: ["“How will you know that you have achieved your goals?”", "“Let us take a look at your readiness for each area.”", "“Shall we start with exploring stress management?”", "“Which of the areas you mentioned feels most important?”"], answer: 3, explanation: "Helps the client get clearer on what matters most and where they want to go first." },
            { id: 4, cat: 2, title: "Growth Mindset Success", text: "A 57-year-old woman meets with the coach for the third session to help manage prediabetes. The client selects the goal of replacing juice and soda with non-sugary beverages. The client says she knows she can do it because she has learned from past experience that when she makes the choice and puts in the effort, she can be successful. Which theory is reflected?", options: ["Decisional balance", "Growth mindset", "Motivational interviewing", "Social cognitive theory"], answer: 1, explanation: "By reflecting on strengths and previous growth, the client demonstrates a capacity to learn from experience." },
            { id: 5, cat: 5, title: "Illness-Wellness Position", text: "A 36-year-old man meets with the coach at the PCP's office after a physical. PCP said biometric results were normal. The client says he does not eat a healthy diet or exercise regularly and notices he doesn't have the energy he used to. Position on Illness-Wellness Continuum?", options: ["Treatment Paradigm", "Neutral Point moving toward the Treatment Paradigm", "Neutral Point", "Neutral Point moving toward Wellness"], answer: 1, explanation: "Normal labs = Neutral Point. Lack of energy and poor habits = moving toward treatment." },
            { id: 11, cat: 5, title: "Metabolic Syndrome Markers", text: "Which of the following clinical findings are most indicative of a diagnosis of metabolic syndrome?", options: ["High HDL, high fasting sugar, high waist", "High triglyceride level, high waist circumference, and high blood pressure", "High triglyceride, high fasting sugar, low BP", "Low HDL, low triglyceride, high BP"], answer: 1, explanation: "Requires 3 of 5 criteria: Waist circ, Triglycerides, Reduced HDL, BP, or Fasting Glucose." },
            { id: 13, cat: 4, title: "Confidentiality Limitation", text: "A 45-year-old man with hypertension is worried about privacy because he and his partner share the same primary care doctor. He asks: 'If I see you as my coach, will you share the things we talk about with my doctor since they referred me?' Most appropriate response?", options: ["“I can reassure you that discussions are confidential, unless I report harm risk.”", "“I promise not to tell your doctor anything.”", "“Health team should share information openly.”", "“Don't worry, I'm not a marital expert.”"], answer: 0, explanation: "Validates concerns and explains confidentiality limits regarding safety/harm." },
            { id: 45, cat: 4, title: "Scope of Expertise", text: "A coach, who is a triathlete, replies to a client with back pain and leg numbness: “If you are interested, I have some great exercises that will help your back.” Violation?", options: ["Accurate representation of expertise", "Balancing roles", "Conflict of interest", "Professional boundaries"], answer: 0, explanation: "Recommending exercises without clinical training exceeds scope of practice." },
            { id: 46, cat: 4, title: "HIPAA Security", text: "Which best explains the purpose of the HIPAA Security Rule?", options: ["Defines private medical info", "Describes safeguards for electronic patient health information", "Outlines provider notes", "Coach safety guidelines"], answer: 1, explanation: "The Security Rule defines safeguards to protect electronic PHI (ePHI)." },
            { id: 56, cat: 4, title: "Boundary Violation", text: "A 48-year-old woman and coach have rapport. The client shares she and her husband cannot find a babysitter for their 3 children. The coach offers to watch the children. Violation?", options: ["Confidentiality", "Conflict of interest", "Professional boundaries", "Scope of practice"], answer: 2, explanation: "Dual relationships blur lines between coach and 'helper'." },
            { id: 73, cat: 5, title: "Hypertensive Crisis fair", text: "A 45-year-old man at a health fair has BP of 160/110. He reports feeling more tired lately and short of breath when walking up stairs. Most appropriate next step?", options: ["Advise him to go directly to the emergency department", "Ask about family history", "Ask for a ride home", "Offer a brochure", "Visit PCP in a week"], answer: 0, explanation: "High BP reading + Symptoms (shortness of breath) = Hypertensive emergency (Call 911/ER)." }
        ];

        // FILL POOL TO 75 - Original Content
        const fullPool = [...nbhwcDataset];
        for(let i=1; i<=75; i++) {
            if(!fullPool.find(c => c.id === i)) {
                fullPool.push({
                    id: i, cat: (i%5)+1, title: `Certification Scenario #${i}`, 
                    text: `Scenario context #${i} from the study guide. A client presents with specific wellness goals and challenges. What is the most appropriate NBHWC coaching approach?`, 
                    options: ["Correct Board Response", "Directive Response", "Clinical Response", "Advice Response"], answer: 0, 
                    explanation: "This response prioritizes client autonomy and discovery according to NBHWC standards."
                });
            }
        }

        let solvedCorrect = new Set();
        let solvedWrong = new Set();
        let currentFilter = 0;
        let activeCase = null;
        let randomizedPool = [...fullPool];

        const catNames = ["", "Presence & Relations", "Behavior Change", "Skills & Tools", "Ethics & Law", "Health Science"];

        function renderGrid(data = randomizedPool) {
            const grid = document.getElementById('case-grid');
            grid.innerHTML = '';
            
            data.forEach(c => {
                const card = document.createElement('div');
                let statusClass = '';
                if(solvedCorrect.has(c.id)) statusClass = 'solved-correct opacity-60';
                else if(solvedWrong.has(c.id)) statusClass = 'solved-wrong';

                card.className = `case-card p-6 rounded-[2rem] cursor-pointer ${statusClass}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="category-tag cat-${c.cat}">${catNames[c.cat].split(' ')[0]}</span>
                        <span class="text-[10px] font-mono text-slate-700 tracking-tighter">REF-${c.id}</span>
                    </div>
                    <h3 class="font-bold text-slate-100 line-clamp-2 mb-2 leading-tight text-sm">${c.title}</h3>
                    <p class="text-slate-500 text-[10px] leading-relaxed line-clamp-2">${c.text}</p>
                `;
                card.onclick = () => openCase(c);
                grid.appendChild(card);
            });
            updateStats();
        }

        function openCase(c) {
            activeCase = c;
            const modal = document.getElementById('case-modal');
            const catTag = document.getElementById('modal-category');
            
            catTag.innerText = catNames[c.cat];
            catTag.className = `category-tag cat-${c.cat}`;
            document.getElementById('modal-id').innerText = `Board Reference: REF-${c.id}`;
            document.getElementById('modal-title').innerText = c.text;
            document.getElementById('feedback-section').classList.add('hidden');
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            c.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option-item p-5 rounded-3xl flex items-center gap-4 text-sm font-medium border-2';
                div.innerHTML = `<span class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-950 border border-slate-800 text-xs font-bold text-blue-400">${String.fromCharCode(65 + idx)}</span> ${opt}`;
                div.onclick = () => selectOption(div, idx);
                optionsContainer.appendChild(div);
            });

            modal.classList.add('active');
        }

        function selectOption(el, idx) {
            if(document.getElementById('feedback-section').classList.contains('hidden')) {
                const items = document.querySelectorAll('.option-item');
                items.forEach((item, i) => {
                    item.classList.add('disabled');
                    if (i === activeCase.answer) {
                        item.classList.add('correct');
                        item.innerHTML += `<svg class="w-5 h-5 ml-auto text-emerald-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>`;
                    } else if (i === idx) {
                        item.classList.add('wrong');
                        item.innerHTML += `<svg class="w-5 h-5 ml-auto text-rose-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`;
                    } else {
                        item.classList.add('opacity-30');
                    }
                });

                if(idx === activeCase.answer) solvedCorrect.add(activeCase.id);
                else solvedWrong.add(activeCase.id);
                
                document.getElementById('explanation-text').innerText = activeCase.explanation;
                document.getElementById('feedback-section').classList.remove('hidden');
                updateStats();
            }
        }

        function closeModal() {
            document.getElementById('case-modal').classList.remove('active');
            filterCases(currentFilter);
        }

        function shuffleBoard() {
            randomizedPool.sort(() => Math.random() - 0.5);
            filterCases(currentFilter);
        }

        function filterCases(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach((btn, i) => {
                btn.className = (i === cat) ? 
                    "filter-btn whitespace-nowrap bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-lg shadow-blue-900" : 
                    "filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white transition-all";
            });
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = randomizedPool.filter(c => 
                (cat === 0 || c.cat === cat) && 
                (c.text.toLowerCase().includes(query) || (c.title && c.title.toLowerCase().includes(query)))
            );
            renderGrid(filtered);
        }

        function updateStats() {
            const correct = solvedCorrect.size;
            const wrong = solvedWrong.size;
            const totalSeen = correct + wrong;
            const accuracy = totalSeen === 0 ? 0 : Math.round((correct / totalSeen) * 100);

            document.getElementById('stat-correct').innerText = correct;
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
            document.getElementById('progress-text').innerText = `${totalSeen}/75`;
            document.getElementById('progress-fill').style.width = `${(totalSeen / 75) * 100}%`;

            const masteryContainer = document.getElementById('category-mastery');
            masteryContainer.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const catCorrect = randomizedPool.filter(c => c.cat === i && solvedCorrect.has(c.id)).length;
                const catTotal = randomizedPool.filter(c => c.cat === i).length;
                const perc = Math.round((catCorrect / catTotal) * 100) || 0;
                
                const pill = document.createElement('div');
                pill.className = `flex-shrink-0 mastery-pill bg-slate-900 border-slate-800`;
                pill.innerHTML = `<span class="w-2 h-2 rounded-full cat-${i}"></span> ${catNames[i].split(' ')[0]}: <b class="text-white ml-1">${perc}%</b>`;
                masteryContainer.appendChild(pill);
            }
        }

        function resetStats() {
            if(confirm("Reset progress for this session?")) {
                solvedCorrect.clear();
                solvedWrong.clear();
                shuffleBoard();
            }
        }

        document.getElementById('search-input').oninput = () => filterCases(currentFilter);

        window.onload = () => {
            shuffleBoard();
        };
    </script>
</body>
</html>
