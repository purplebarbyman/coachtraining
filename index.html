<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBHWC Study Guide & Question Bank</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --border: #334155;
            --success: #34d399;
            --error: #f87171;
            --card-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }

        * { box-sizing: border-box; transition: background-color 0.2s, color 0.2s; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-primary); color: var(--text-main); margin: 0; line-height: 1.6; }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .stat-value { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }

        .progress-container {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .progress-bar-bg { height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; display: flex; margin-top: 0.5rem; }
        .progress-fill-correct { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
        .progress-fill-wrong { height: 100%; background: var(--error); width: 0%; transition: width 0.4s ease; }

        .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            gap: 0.4rem;
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            max-height: 240px;
            overflow-y: auto;
            margin-bottom: 2rem;
        }

        .grid-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0.35rem;
            border: 1px solid var(--border);
            cursor: pointer;
            background: var(--bg-primary);
        }

        .grid-item:hover { border-color: var(--accent); background: rgba(37, 99, 235, 0.05); }
        .grid-item.active { border: 2.5px solid var(--accent); background: rgba(37, 99, 235, 0.1); }
        .grid-item.correct { background: var(--success) !important; color: white; border: none; }
        .grid-item.wrong { background: var(--error) !important; color: white; border: none; }

        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--card-shadow);
        }

        .category { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-bottom: 1rem; opacity: 0.8; }
        .question-text { font-size: 1.15rem; font-weight: 500; margin-bottom: 1.5rem; color: var(--text-main); }
        .options-grid { display: grid; gap: 0.85rem; }

        .option {
            padding: 1.15rem;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            cursor: pointer;
            text-align: left;
            background: transparent;
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.5;
        }

        .option:hover:not(.disabled) { border-color: var(--accent); background: rgba(37, 99, 235, 0.05); }
        .option.correct { background: rgba(16, 185, 129, 0.15) !important; border-color: var(--success) !important; color: var(--success) !important; font-weight: bold; }
        .option.wrong { background: rgba(239, 68, 68, 0.1) !important; border-color: var(--error) !important; color: var(--error) !important; }

        .explanation {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: rgba(37, 99, 235, 0.05);
            border-left: 5px solid var(--accent);
            border-radius: 0 0.5rem 0.5rem 0;
            display: none;
        }
        .explanation.visible { display: block; animation: fadeIn 0.4s ease; }

        .controls { display: flex; gap: 0.5rem; }
        button { padding: 0.6rem 1.2rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        button.primary { background: var(--accent); color: white; border: none; }
        button:hover:not(:disabled) { background: var(--border); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .nav-footer { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 5rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) {
            .container { padding: 0.5rem; }
            .question-card { padding: 1.25rem; }
            header { padding: 1rem; }
            .nav-footer { flex-direction: column; }
            .nav-footer button { width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 800; font-size: 1.1rem; color: var(--accent)">NBHWC Study Pro</div>
    <div class="controls">
        <button id="shuffle-btn">🔀 Shuffle Order</button>
        <button id="reset-btn" style="color: var(--error)">✖ Reset All</button>
        <button id="theme-btn">🌓</button>
    </div>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="stat-completed">0 / 150</div>
            <div class="stat-label">Questions Tried</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-accuracy">0%</div>
            <div class="stat-label">Current Accuracy</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-correct">0</div>
            <div class="stat-label">Correct Hits</div>
        </div>
    </div>

    <div class="progress-container">
        <div class="grid-header">
            <div class="stat-label">Mastery Progress</div>
            <div class="stat-label" id="percent-label">0% Complete</div>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill-correct" id="fill-correct"></div>
            <div class="progress-fill-wrong" id="fill-wrong"></div>
        </div>
    </div>

    <div class="grid-header">
        <div class="stat-label">Select Question</div>
        <button id="toggle-grid-btn" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">Hide Grid</button>
    </div>
    <div class="question-grid" id="question-grid"></div>

    <div id="quiz-area"></div>

    <div class="nav-footer">
        <button id="prev-btn">← Previous</button>
        <button id="next-btn" class="primary">Next Question →</button>
    </div>
</div>

<script>
    const rawQuestions = [
        // Set 1 (1-75) - FULL SCENARIOS ADDED
        { id: 1, category: "3.5. Client self-efficacy", q: "A 52-year-old man meets with the coach at the company’s onsite wellness clinic for the second session to increase the level of exercise and reduce stress in order to lower the blood pressure. The client says the client is very concerned that if the client does not get the blood pressure in check, the client may end up having a stroke like the client's father. The client appears to be upset. Which of the following is the most appropriate next step by the coach?", options: ["Affirm the client for being proactive", "Provide a positive reframe", "Suggest meditation to reduce stress", "Use appropriate silence"], answer: 0, logic: "Affirming client’s behaviors builds confidence and self-efficacy." },
        { id: 2, category: "1.1. Coach presence", q: "A 60-year-old woman meets with the coach via videoconferencing for the first session. The client was recently diagnosed with breast cancer and was referred to the coach by the cancer support group coordinator. The client is interested in implementing healthy lifestyle changes. A section of their conversation is shown:\n\nClient: I am sure you have heard cancer stories over and over again.\nCoach: Many survivors do share similar experiences and feelings when they learn they have cancer.\nClient: Yes, and I do not want to bore you with all the sad details.\nCoach: You are concerned I have already heard it all before. Your story is important. What did it feel like to learn you have cancer?\n\nWhich of the following techniques best describes the coach’s response?", options: ["Affirming emotional state", "Assessing resilience", "Demonstrating curiosity without assumptions", "Redirecting focus", "Shifting perspective"], answer: 2, logic: "Coach uses a 'not-knowing' mindset, curiosity without assumptions, and supports client expertise." },
        { id: 3, category: "1.4. Session preparation", q: "A 38-year-old woman speaks with the coach on the phone for the first session to discuss healthy behaviors. The client completed chemotherapy and radiation therapy for breast cancer and is now in remission. The client tells the coach that the client is concerned about a relapse and wants to integrate new healthy behaviors into daily routines, including cardiovascular exercise, strength training, sleeping at least 7 hours nightly, stress management, and having fun with friends again. Which of the following is the most appropriate response by the coach?", options: ["“How will you know that you have achieved your goals?”", "“Let us take a look at your readiness for each area you want to change.”", "“Shall we start with exploring stress management?”", "“Which of the areas you mentioned feels most important?”"], answer: 3, logic: "Explores focus and importance to the client to determine the starting point." },
        { id: 4, category: "2.7. Growth vs. Fixed Mindset", q: "A 57-year-old woman meets with the coach at the coach’s office for the third session in order to help manage prediabetes. During the session, the client selects the goal of replacing juice and soda with nonsugary beverages. The client says that the client knows the client can do it because the client has learned from past experience that when the client makes the choice and puts in the effort, the client can be successful. Which of the following constructs or theories is most likely reflected by this client’s comments?", options: ["Decisional balance", "Growth mindset", "Motivational interviewing", "Social cognitive theory", "Transtheoretical Model"], answer: 1, logic: "Belief in effort and learning from past experience reflects a growth mindset." },
        { id: 5, category: "5.1. Health promotion", q: "A 36-year-old man meets with the coach at the primary care provider’s (PCP) office for the first session after an annual physical examination. The client’s PCP said all biometric results were within the normal range. During the session, the client says that the client does not eat a healthy diet or exercise regularly. The client says, “I may seem healthy, but I notice that I do not have the energy that I used to.” This client most likely falls on which of the following points on the Illness–Wellness Continuum?", options: ["Treatment Paradigm, but not moving", "Neutral Point moving toward the Treatment Paradigm", "Neutral Point", "Neutral Point moving toward High-Level Wellness"], answer: 1, logic: "Labs are normal (neutral), but poor habits move them toward treatment (illness)." },
        { id: 6, category: "1.5. Early sessions", q: "A 19-year-old woman who is a collegiate softball player comes to the coach’s office for an introductory conversation. The client says, “I came to see you today because the professor of my wellness class suggested it. However, I already have a head coach, two assistant coaches, and a conditioning coach. Why would I even consider adding another coach at this point?” Which of the following is the most appropriate response by the coach?", options: ["“Come see me after you finish the softball season when you have more time to establish holistic goals.”", "“Each of your team coaches specializes in one performance area. A health and wellness coach can help you explore your overall wellbeing.”", "“I encourage you to trust your intuition. If you believe wellness coaching is not necessary, then I support your decision.”", "“I would suggest that you continue to work with the coaches you have.”"], answer: 1, logic: "Clarifies the unique scope of health and wellness coaching." },
        { id: 7, category: "3.4. Perspective shifts", q: "A 55-year-old woman meets with the coach at the primary care provider’s office for the ninth weekly session to work on creating a healthier lifestyle. During today’s session, the client says,“I realize that my eating patterns are not in line with my wellness goals. I typically eat well during the day and have a healthy dinner when I get home, but then I tend to nibble all evening until bedtime.” To help this client develop an action plan, which of the following is the most appropriate next step by the coach?", options: ["Ask the client to track the calories consumed between dinner and bedtime for 1 week", "Brainstorm with the client healthy foods to eat at night", "Investigate potential triggers for eating after dinner", "Review the client’s wellness vision"], answer: 2, logic: "Exploring triggers helps the client observe behavior and find underlying causes." },
        { id: 8, category: "3.1. Facilitation tools", q: "A 32-year-old woman meets with the coach at the primary care physician’s office to work on smoking cessation. She has smoked one pack of cigarettes daily for 17 years. The client does not want to quit, but the client is conflicted because the client and the client’s partner recently decided to start a family. Which of the following is most likely to help this client make a choice?", options: ["Bottom-lining", "Confidence scale", "Decisional balance", "Self-compassion"], answer: 2, logic: "Decisional balance explores perceived pros and cons of behavior change." },
        { id: 9, category: "1.6. Follow-up sessions", q: "A 65-year-old man meets the coach at the community center for his second session to focus on having fun with a healthy lifestyle in retirement. He says he recently retired and enthusiastically shares all the activities he is ready to try. A section of their conversation is shown:\n\nClient: I have big plans to travel across the country, complete a marathon, go on a safari, volunteer with my grandchildren’s baseball team, and so much more. Where do I even start so that I can check them all off my wish list?\nCoach: You are taking advantage of this newfound freedom and are motivated to try new things.\n\nAfter working with the client to establish a wellness vision, which of the following is the most appropriate next step by the coach?", options: ["Assess the client’s confidence in completing his wish list", "Cocreate a chart to track the client’s progress", "Define an action step for the client", "Work with the client to create a SMART goal"], answer: 3, logic: "SMART goals are a natural progression after completing a vision statement." },
        { id: 10, category: "2.7. Mindset", q: "A 30-year-old man speaks with the coach on the phone for the fifth session to discuss the goal of completing a 5km race. Despite persistent training, the client is unhappy with progress. Today, the client appears defeated and says, “I am just not meant to be a runner. I cannot do this.” Which of the following is the most appropriate next step by the coach to nurture a growth mindset in this client?", options: ["Agree with the client’s statement that some people are not natural runners", "Create a relapse plan to restart the client’s training", "Encourage positive thinking by reassuring the client", "Explore what the client has learned from persistent training efforts"], answer: 3, logic: "Invites the client to see progress as learning rather than binary success/failure." },
        { id: 11, category: "5.3. Chronic disease", q: "Which of the following clinical findings are most indicative of a diagnosis of metabolic syndrome?", options: ["High HDL, High Sugar, High Waist", "High Triglycerides, High Waist, High Blood Pressure", "High Triglycerides, High Sugar, Low Blood Pressure", "Low HDL, Low Triglycerides, High BP"], answer: 1, logic: "Criteria: High waist, high TG, low HDL, high BP, or high fasting glucose." },
        { id: 12, category: "3.4. Awareness", q: "A 45-year-old man speaks with the coach on the phone for the third session to work on lowering blood pressure. The goal from the previous session was to practice a mindful meditation each morning. Today, the client says,“I was not able to complete my goal this week. I had a few bad days at work, and I was only able to meditate on four mornings. I am not feeling very positive at the moment.” After offering a reflection, which of the following is the most appropriate response by the coach?", options: ["“Let us talk about setting yourself up for success next week.”", "“Perhaps the goal could be adjusted to fit your schedule.”", "“Tell me about how you felt on those mornings when you meditated.”", "“You did really well to meditate on four mornings.”"], answer: 3, logic: "Acknowledging effort increases resilience and self-efficacy." },
        { id: 13, category: "4.3. Code of Ethics", q: "A 45-year-old man speaks with the coach on the phone for an introductory conversation about lifestyle modifications for hypertension. The client says: “My partner and I share the same primary care doctor... If I see you as my coach, will you share the things we talk about with my doctor since they referred me?” Which of the following is the most appropriate response by the coach?", options: ["“I hear your concerns and can reassure you that the content is confidential, unless I need to report risk of harm.”", "“I promise not to tell your doctor anything you do not want me to.”", "“It would be best if we could all share information openly.”", "“I am not an expert in the marital issues you are alluding to.”"], answer: 0, logic: "Validates concerns while clearly stating confidentiality and its limitations." },
        { id: 14, category: "3.2. Communication", q: "A 79-year-old woman comes to the coach’s office for the fourth session after being diagnosed with mild dementia. The client’s daughter has created a schedule for the client that includes 12 daily activities. The client completes 4 of 12. A section of conversation:\n\nClient: I feel fine with the changes I have made. I sleep better, and I have more energy, but my daughter is treating me like a child.\nCoach: You are doing quite a few new things and feel much better. You are also frustrated with your daughter because she wants you to do even more.\n\nWhich of the following best describes the coach’s response?", options: ["Amplified reflection", "Double-sided reflection", "Recall", "Simple content reflection"], answer: 1, logic: "Double-sided reflections capture opposing feelings (success vs. frustration)." },
        { id: 15, category: "2.3. MI Concepts", q: "A 58-year-old woman has gradually increased daily aquatherapy time from 10 minutes to 30 minutes. Today, the client says: “I cannot believe I have made it this far, but I am not sure I can keep this up.” The coach replies, “What would make it worthwhile to maintain this routine?” The coach’s response best demonstrates which motivational interviewing concept?", options: ["Creating partnership", "Encouraging acceptance", "Evoking importance", "Providing affirmation", "Showing compassion"], answer: 2, logic: "Draws out client values and emotional drivers for change." },
        { id: 16, category: "3.5. Self-efficacy", q: "A 45-year-old woman speaks with the coach to improve work-life balance. Today, the client’s boss offered a promotion. The position requires more hours and travel, and the client says it is their “dream job.” The client feels torn and worries that family life will suffer if the job is accepted. Which of the following is the most appropriate next step by the coach?", options: ["Ask the client to list aspects of the role that make it the “dream job”", "Assist the client in evaluating the short-term and long-term benefits and consequences", "Help the client identify colleagues to discuss balance", "Offer to help the client explore other job opportunities"], answer: 1, logic: "Invites pros/cons evaluation prior to decision-making." },
        { id: 17, category: "3.1. Facilitation", q: "A 42-year-old woman wants to go back to school but is worried about how she would find time for it; she works full-time and has four teenage children. She feels torn and says that if she does not go back soon, she likely never will. Which of the following is the most appropriate response by the coach to encourage self-discovery?", options: ["“Could you wait until your children are a little older?”", "“Do you think your children would support your desire?”", "“Is it realistic that you could balance school, work, and family?”", "“What are the benefits of going now, and what would you lose if you did not go at this time?”"], answer: 3, logic: "Uses decisional balance to explore the urgency and value of the choice." },
        { id: 18, category: "3.1. Facilitation", q: "A 40-year-old woman has set the goal to walk briskly for 10 minutes on Monday, Wednesday, and Friday at lunchtime. To determine the client’s ability to meet this physical activity goal, which of the following is the most appropriate approach?", options: ["Ask the client how long she has been thinking about starting", "Ask the client how the client will reward the client", "Ask the client to rate confidence in achieving the goal using a 10-point scale", "Ask the client to write down the pros and cons"], answer: 2, logic: "Confidence scales determine readiness and realistic goal levels." },
        { id: 19, category: "1.1. Presence", q: "A 49-year-old woman struggling to stick to a smoking quit plan due to her mother's stroke says: “I do not want to end up like her.” Coach replies: “You are still dedicated to quitting... How might you continue on your path despite your recent difficulty?” Which of the following skills is the coach most likely demonstrating?", options: ["Being curious without assuming", "Bottom-lining", "Conveying unconditional positive regard", "Identifying values"], answer: 2, logic: "Accepting/valuing the client without conditions regardless of struggles." },
        { id: 20, category: "5.3. Chronic disease", q: "According to the Centers for Disease Control and Prevention, which of the following is the most common preventable cause of death in the United States?", options: ["Alcohol use", "Firearm-related incidents", "Illicit drug use", "Tobacco use"], answer: 3, logic: "CDC identifies cigarette smoking as the leading preventable cause of death." },
        { id: 21, category: "1.5. Early sessions", q: "A 36-year-old woman enrolls in telephone-based coaching. During the first session, the coach asks the client to introduce themselves and describe what they hope to accomplish. Which of the following additional topics is most appropriate to initially discuss during this session?", options: ["Additional worksite support", "Client’s self-assessment of health status", "SMART goals", "Work stress impact on health"], answer: 1, logic: "Wellness assessments create a nonjudgmental entry point for visioning." },
        { id: 22, category: "1.1. Presence", q: "A 56-year-old man meets the coach at work to explore strategies to improve energy. Which of the following is the most appropriate question to invite the client to provide feedback for the coach?", options: ["“How can I best support you moving forward?”", "“I think our sessions are going great so far. What do you think?”", "“If you were not happy with my coaching, you would share with me, right?”", "“Can you please email me your feedback on my coaching?”"], answer: 0, logic: "Empowers the client to share what is working and what they need." },
        { id: 23, category: "5.3. Disease", q: "According to the Centers for Disease Control and Prevention, which of the following risk factors for heart disease is often called a “silent killer” because of a lack of symptoms?", options: ["Diabetes", "High blood pressure", "Obesity", "Tobacco use"], answer: 1, logic: "High blood pressure typically has no symptoms." },
        { id: 24, category: "5.3. Disease", q: "According to the Centers for Disease Control and Prevention, which of the following is most likely to decrease how much a person drinks on an occasion by 25%?", options: ["Smartphone notifications", "Insurance coverage", "Community activities", "Alcohol screening and brief counseling"], answer: 3, logic: "SBI is a preventative service reducing excessive use." },
        { id: 25, category: "3.1. Facilitation", q: "A 38-year-old man becomes agitated and begins pacing, mumbling: “The doctors are totally off base... if I give them a chance, they will ruin my knee!” Which of the following is the most appropriate next step by the coach?", options: ["Ask the client to compose himself", "Explore the client’s emotions and apply decisional balance", "Mirror the client’s agitation", "Point out inappropriate emotions"], answer: 1, logic: "Validates emotions while transitioning into structured self-awareness." },
        { id: 26, category: "1.1. Presence", q: "An 87-year-old woman wants to socialize but lacks reliable transportation. She mentions a sewing group and a friend who goes to church. Which of the following is the most appropriate response by the coach to move toward action?", options: ["“Great start. What other ideas can you think of?”", "“Maybe your friend can also help you get to the senior center.”", "“Should we call your friend now so you do not forget?”", "“Would you be willing to ask your friend for a ride to church?”"], answer: 3, logic: "Helps client name commitments to clarify direction and agency." },
        { id: 27, category: "4.3. Ethics", q: "A coach deliverying a presentation to business owners finds relevant content online. The presentation will be copied as a handout. Which of the following is the most appropriate course of action by the coach?", options: ["Cite the original works on the handouts", "Copy content without citations", "Offer citations to interested attendees later", "Provide citations verbally"], answer: 0, logic: "NBHWC requires recognizing/honoring the contributions of others." },
        { id: 28, category: "5.3. Chronic disease", q: "Which of the following risk factors is most likely increased by metabolic syndrome?", options: ["Cardiovascular disease", "COPD", "Fibromyalgia", "Rheumatoid arthritis"], answer: 0, logic: "Increases risk for heart disease, diabetes, and stroke." },
        { id: 29, category: "5.3. Chronic disease", q: "Which of the following is the primary cause of overweight and obesity?", options: ["Caloric imbalance", "Comorbidities", "Economic factors", "Hereditary traits"], answer: 0, logic: "Energy imbalance (eating more than utilized) is the primary cause." },
        { id: 30, category: "5.3. Chronic disease", q: "Excess fat in which of the following areas of the body is most likely to increase an individual’s risk for obesity-related diseases?", options: ["Abdomen", "Hips", "Lower extremities", "Upper extremities"], answer: 0, logic: "Abdominal/central fat distribution is linked to type 2 diabetes and CV disease." },
        { id: 31, category: "5.3. Chronic disease", q: "According to the American Psychiatric Association, which is the most prevalent mental disorder among U.S. adults?", options: ["Anxiety disorder", "Bipolar disorder", "Major depressive disorder", "PTSD"], answer: 0, logic: "Anxiety affects nearly 30% of adults." },
        { id: 32, category: "5.3. Chronic disease", q: "A 43-year-old woman works 12-hour night shifts and sleeps inconsistently. The coach asks what the client knows about sleep and weight management. What is the most appropriate first step in this model?", options: ["Assist with food journal", "Track sleep and suggest makeup days", "Explore feelings about sleep meds", "Elicit what the client already knows (Ask-Offer-Ask)"], answer: 3, logic: "Ask-Offer-Ask model: elicit what client already knows first." },
        { id: 33, category: "3.5. Self-efficacy", q: "A 40-year-old man cleaning up his office succeeds and shares this accomplishment but asks: “I cleaned my office, but how will that help me lose weight?” Which response best encourages behavioral stretch?", options: ["“Cleaning clutter creates space.”", "“How does it feel to have a clean office?”", "“Success in one area leads to success in others.”", "“What did you learn?”"], answer: 3, logic: "Encourages reflection on learning to increase general self-efficacy." },
        { id: 34, category: "1.5. Early sessions", q: "A 32-year-old woman says, “My son has a fatal blood cancer... What should I do next?” Her voice is calm, but she appears distressed. Which is the most appropriate coach approach?", options: ["Ask how husband is handling things", "Ask if referral to therapist would help", "Ask permission for info on support groups", "Ask what the client envisions would be the best use of their time together today"], answer: 3, logic: "Listens for what matters most to the client right now." },
        { id: 35, category: "2.3. MI Concepts", q: "A 54-year-old woman sets a goal to walk instead of a cigarette and rates confidence at 6 out of 10. Which response best elicits change talk?", options: ["“A 6 is high since you love relaxing.”", "“A 6 is good; curious how it goes.”", "“How can we adjust your goal?”", "“What makes your confidence a 6 instead of a 4?”"], answer: 3, logic: "Drawing out existing strengths/reasons for confidence (change talk)." },
        { id: 36, category: "3.1. Facilitation", q: "The client rates the importance of weight loss as 3 out of 10, saying: “It’s only a 3… maybe I don’t want to lose weight after all.” Which response is most appropriate?", options: ["“A 3 means not ready to change.”", "“If it’s not important, choose a new goal.”", "“It’s okay to feel that way.”", "“What makes your rating a 3 and not a 1?”"], answer: 3, logic: "Uses scaling to acknowledge current motivation and elicit change talk." },
        { id: 37, category: "3.2. Communication", q: "A 42-year-old woman has labs showing recurrence of colon cancer. She begins to cry: “I just don’t think I can do this horrible chemotherapy again.” Which is the most appropriate coach response?", options: ["Affirm she has the strength", "Be present to hold space", "Encourage new goals", "Express how unfair recurrence is"], answer: 1, logic: "Holding space fosters deep trust and listening." },
        { id: 38, category: "3.4. Awareness", q: "A 31-year-old woman is disappointed in her progress and says she feels like a failure and lacks willpower. Which coach response best addresses self-defeating perceptions?", options: ["“Changing habits takes time.”", "“I hear your frustration… you feel like a failure…”", "“Want to brainstorm ideas?”", "“I disagree that you are a failure.”"], answer: 1, logic: "Reflection acknowledges and validates feelings." },
        { id: 39, category: "1.5. Early sessions", q: "A 32-year-old woman wants the coach to provide guidance on weight and stress. The coach gives the client an exercise to help her distinguish between which goals are important and which goals are urgent. Which of the following best describes the purpose of this exercise?", options: ["Clarify next steps", "Define long-term goals that will lead to desired outcomes", "Explore willingness to commit", "Identify assumptions"], answer: 1, logic: "Translates vision into focused, meaningful goals." },
        { id: 40, category: "1.6. Follow-up", q: "A 27-year-old woman says she will walk more next week. Which is the most appropriate SMART-goal-building question?", options: ["“Do you have a friend to walk with?”", "“How will you feel if you lose weight?”", "“How will you know when you have met your goal?”", "“On a scale of 0–10, how pleased will you be?”"], answer: 2, logic: "Explores the 'how' and measurability of the goal." },
        { id: 41, category: "1.5. Early sessions", q: "A 45-year-old woman misses her second session and asks for Sunday or late night appointments outside office hours. What is the MOST appropriate next step?", options: ["Advise office to expand hours", "Assess client readiness", "Inform client coaching is not provided outside established hours", "Mention an exception"], answer: 2, logic: "Maintaining integrity and professional boundaries." },
        { id: 42, category: "3.6. Expanding conversation", q: "A 41-year-old man says: “I’ve smoked for a long time… I’m tired of how my clothes smell. It’s expensive… but I’m ready to try.” What is the most appropriate coach response?", options: ["“How does knowing all of this impact your plan to quit?”", "“How many cigarettes do you smoke?”", "“What is your timeline?”", "“What might you do with money saved?”"], answer: 0, logic: "Evokes deeper purpose and planning language." },
        { id: 43, category: "5.3. Chronic disease", q: "A 33-year-old man has a BMI of 25 kg/m². This BMI falls within which range?", options: ["Underweight", "Normal", "Overweight", "Obese"], answer: 2, logic: "Overweight is 25 to <30." },
        { id: 44, category: "4.3. Ethics", q: "A 62-year-old man has low back pain and numbness. The coach, who is a triathlete, replies: “If you are interested, I have some great exercises that will help your back.” According to the NBHWC Code of Ethics, this violates which principle?", options: ["Accurate representation of expertise", "Balancing multiple roles", "Conflict of interest", "Professional boundaries"], answer: 0, logic: "Exceeds scope of practice without clinical training." },
        { id: 45, category: "4.4. Legal", q: "Which best explains the purpose of the HIPAA Security Rule?", options: ["Defines private medical info", "Describes safeguards to ensure protection of ePHI", "Outlines note inclusion", "Provides safety guidelines"], answer: 1, logic: "Protects electronic protected health information." },
        { id: 46, category: "1.4. Prep", q: "A coach works from home during construction. Background noise from family is sometimes heard during sessions. What are the most appropriate actions?", options: ["Review client materials", "Silence cellphones", "Take a moment to focus", "Use a headset and create environmental boundaries"], answer: 3, logic: "Upholds session integrity and professionalism." },
        { id: 47, category: "5.3. Disease", q: "A 45-year-old man meets the coach for biometric screening. BMI is 29 kg/m². What is the appropriate BMI classification?", options: ["Underweight", "Normal", "Overweight", "Obese"], answer: 2, logic: "25-29.9 is overweight." },
        { id: 48, category: "3.5. Self-efficacy", q: "A 38-year-old woman drinks alcohol to calm nerves. She asks for coping ideas. Which response is most appropriate?", options: ["“Is it dangerous around children?”", "“Drinking eases nerves.”", "“I’m happy you want to give up alcohol.”", "“What other ways have you used in the past to manage stress?”"], answer: 3, logic: "Invites exploration of past coping strategies and self-efficacy." },
        { id: 49, category: "1.1. Presence", q: "A 46-year-old woman says: “I have struggled with my weight all my life. I gain it, lose it, and gain it again.” The coach responds: “That must be very frustrating.” Which skill is the coach demonstrating?", options: ["Being patient", "Bottom-lining", "Eliciting motivation", "Empathizing"], answer: 3, logic: "Validates emotion with empathy." },
        { id: 50, category: "4.3. Ethics", q: "A human resources director requests that the coach divulge the content of a coaching session for an employee. Which of the following is the most appropriate response by the coach?", options: ["“I can email a summary.”", "“I will ask my client.”", "“The content of coaching sessions is confidential.”", "“What would you like to know?”"], answer: 2, logic: "Maintains strictest level of confidentiality." },
        { id: 51, category: "4.4. Legal", q: "A 28-year-old coach steps away from the desk in a private office inside a health insurance company. Which action is necessary for HIPAA compliance?", options: ["Ask assistant to block visitors", "Lock the computer before leaving", "Remind coworkers of confidentiality", "No action needed"], answer: 1, logic: "Prevents unauthorized access to client data (HIPAA)." },
        { id: 52, category: "4.3. Ethics", q: "A 28-year-old woman says: “I’m ready to stop seeing my therapist and continue coaching instead.” Which is the MOST appropriate coach response?", options: ["“We should celebrate.”", "“I'm concerned I'd have to take that role.”", "“I'm thrilled but therapy helps too.”", "“Have you discussed a plan with your therapist for ending therapy?”"], answer: 3, logic: "Protects psychological safety and respect for other professionals." },
        { id: 53, category: "3.2. Communication", q: "A 78-year-old woman mentions group fitness and transportation issues. The coach listens quietly. Which skill is being used?", options: ["Acknowledging state of being", "Benevolence", "Showing empathy", "Using silence appropriately"], answer: 3, logic: "Gives client time to process and reflect." },
        { id: 54, category: "2.3. MI Concepts", q: "A 50-year-old man who does not know how to cook asks: “What simple healthy meal could I make for my new girlfriend?” The coach responds by asking if he would like to brainstorm an entrée together. Which concept?", options: ["Acceptance", "Autonomy", "Collaboration", "Compassion"], answer: 2, logic: "Elicits client expertise and choices through partnership." },
        { id: 55, category: "1.1. Presence", q: "A 25-year-old graduate student says: “Graduate school is so demanding… I can’t figure out how to get everything done.” What is the most appropriate initial response?", options: ["“I went to therapy…”", "“Maybe you're making it harder.”", "“Of course you're stressed.”", "“You are committed to your responsibilities…”"], answer: 3, logic: "Responds to underlying meaning and warmth." },
        { id: 56, category: "1.5. Early sessions", q: "A 32-year-old woman begins describing issues (divorce, lack of sleep, stress). The coach has already given an empathic reflection. What is the MOST appropriate next response?", options: ["“My divorce affected exercise too.”", "Ask about sleep challenges", "Ask about divorce circumstances", "“Which of these topics would you like to address first?”"], answer: 3, logic: "Strategic question to help client identify focus." },
        { id: 57, category: "1.6. Follow-up", q: "At the end of a session about life and goals, the coach summarizes. Which is the most appropriate follow-up question?", options: ["“How can I help facilitate goals?”", "“To help choose focus areas…”", "“What is one takeaway you learned from today?”", "“What concerns you most?”"], answer: 2, logic: "Reinforces active learning and meaning-making." },
        { id: 58, category: "3.2. Communication", q: "A 30-year-old woman with hypertension wants to lose 30 lb in 5 weeks for her wedding. Which response is most appropriate?", options: ["“I hear how motivated you are. What ideas do you have next?”", "“I think 5 kg is more realistic.”", "“You might regain it.”", "“That plan is aggressive.”"], answer: 0, logic: "Reflects enthusiasm without judgment and uses open question." },
        { id: 59, category: "4.3. Ethics", q: "A 19-year-old is transitioning to college. Parents paid for coaching. After session four, the mother requests an update. Most appropriate next step?", options: ["Adhere to confidentiality", "Contact client for permission", "Provide records to mother", "Schedule appointment with mother"], answer: 0, logic: "Confidentiality applies regardless of who pays." },
        { id: 60, category: "3.4. Awareness", q: "A 28-year-old woman says: “I totally blew it. I met my friends for happy hour... I felt guilty the rest of the week.” To reframe this statement, which response is most appropriate?", options: ["“Everyone makes mistakes.”", "“I hear your disappointment. What are some good choices you made last week?”", "“Look on the bright side.”", "“Guilt can inspire change.”"], answer: 1, logic: "Validates feelings while inviting exploration of positives." },
        { id: 61, category: "1.5. Early sessions", q: "A 48-year-old man completed a wellness assessment before his first session. Most appropriate next step?", options: ["Advise major concerns", "Align results with guidelines", "Explore what the client learned from completing the assessment", "Support resource needs"], answer: 2, logic: "Assessment supports self-discovery, not diagnosis." },
        { id: 62, category: "3.1. Facilitation", q: "A 60-year-old woman says: “I can lose weight, but I can’t keep it off.” The coach responds: “I would like to learn more about what life was like for you when you were successful.” Which best describes this?", options: ["Attentive", "Attuned", "Curious without assuming", "Empathy"], answer: 2, logic: "Encourages sharing of past successful experiences." },
        { id: 63, category: "4.3. Ethics", q: "A 29-year-old man reports discomfort because his personal trainer revealed being gay. Most appropriate next step?", options: ["Acknowledge the dilemma and explore alternatives", "End the coaching relationship", "Inquire about origins of beliefs", "Sympathize with discomfort"], answer: 0, logic: "Nonjudgmental approach supporting next steps." },
        { id: 64, category: "3.1. Facilitation", q: "A 62-year-old woman asks: “What are ways to remember to take my medications?” Most appropriate initial response?", options: ["“How often do you remember?”", "“Other clients use pill boxes.”", "“There are lots of tools.”", "“Would it be helpful to brainstorm some ideas together?”"], answer: 3, logic: "Brainstorming helps explore multiple solutions." },
        { id: 65, category: "1.5. Early sessions", q: "An 84-year-old woman fears dialysis and hopes to live to see her great-granddaughter graduate in 4 years. Visioning question?", options: ["“How important is avoiding dialysis?”", "“How will it feel to attend graduation?”", "“What do you know about your condition?”", "“What one thing might improve things?”"], answer: 1, logic: "Connects client with what matters most (graduation)." },
        { id: 66, category: "4.3. Ethics", q: "A 24-year-old non-binary client did not fill out intake because it forced a male/female choice. Response?", options: ["Acknowledge emotions and invite preferred pronouns", "Apologize and move on", "Refer to another coach", "Say it was a standard form"], answer: 0, logic: "Validates experience and supports inclusive care." },
        { id: 67, category: "4.3. Ethics", q: "A coach reacts negatively to a transitioning client and recommends counseling to “sort things out.” Violates?", options: ["Not a violation", "Not a violation because anxiety", "Violates code - discriminates against identity", "Violates code - outside scope"], answer: 2, logic: "Coaches must refrain from discriminatory behavior." },
        { id: 68, category: "1.5. Early sessions", q: "A 55-year-old woman meets with the coach at the community wellness center for her second session. The client is a caregiver for both her elderly parents and her school-aged children. She says she is struggling with weight loss and feels scattered. Which of the following is the most appropriate next step by the coach?", options: ["Explain stress impacts weight", "Explore discrepancies between values and goals", "Invite expert perspectives", "Use a confidence ruler"], answer: 1, logic: "Identifies gap between present and desired state." },
        { id: 69, category: "5.3. Disease", q: "A 72-year-old man reports walking to the mailbox twice daily as his only exercise. Which of the following are risk factors outside his control?", options: ["Age and sex", "Exercise and age", "Family history and exercise", "Diet and stress"], answer: 0, logic: "Non-modifiable factors include age, sex, race, history." },
        { id: 70, category: "5.3. Disease", q: "A 53-year-old woman mentions workplace screening showed BP was 160/95 mmHg. Most appropriate next response?", options: ["Ask what next steps she would like to take regarding BP", "Instruct her to take BP at home", "Redirect back to insomnia", "Stop session and make urgent appointment"], answer: 0, logic: "Ask-Offer-Ask aligns with client-led choice for non-emergencies." },
        { id: 71, category: "1.5. Early sessions", q: "A 36-year-old woman with type 2 diabetes says: “It has been a very difficult year.” Most appropriate coach response?", options: ["“What can you do to prevent hospitalization?”", "“What is the impact on your life?”", "“What makes managing most difficult?”", "“What would a good year look like?”"], answer: 3, logic: "Visioning identifies the gap to move forward." },
        { id: 72, category: "5.3. Disease", q: "According to the CDC, which most increases high blood pressure risk?", options: ["Being underweight", "A high-sodium diet", "Inadequate sleep", "Less than 250 min activity"], answer: 1, logic: "Diet (high sodium, low potassium) is a major risk." },
        { id: 73, category: "5.3. Disease", q: "A 45-year-old man has BP of 160/110 mmHg and feels short of breath when walking up stairs. Most appropriate next step?", options: ["Advise him to go directly to the emergency department", "Ask about family history", "Ask him to contact someone for a ride", "Suggest he visit PCP within a week"], answer: 0, logic: "Symptoms indicate hypertensive emergency (AHA: call 911)." },
        { id: 74, category: "5.3. Disease", q: "A 50-year-old woman with BMI of 26 says she does not understand what the number means. How is this classified?", options: ["Underweight", "Normal", "Overweight", "Obese"], answer: 2, logic: "25-29.9 is overweight." },
        { id: 75, category: "1.5. Early sessions", q: "A 36-year-old woman sharing she is going through divorce and has increased drinking/smoking. Response?", options: ["Healthier strategies?", "Impact explained?", "“I hear your grieving the loss... how can I best support you?”", "Reducing alcohol starting?"], answer: 2, logic: "Acknowledges hardship and invites client needs." },

        // Set 2 (76-150) - FULL SCENARIOS ADDED
        { id: 76, category: "MI Techniques • 3.3", q: "A client worried because her husband keeps unhealthy snacks at home says: “… I know I’m going to be tempted when I see my husband’s cookies in the cupboard.” Coach reflects. Next response?", options: ["“Maybe you can find a healthier cookie option.”", "“This goal may be too big.”", "“What will you do when that happens?”", "“Where else can you keep snacks?”"], answer: 2, logic: "Anticipates barriers and empowers client planning." },
        { id: 77, category: "Emotional Awareness • 3.4", q: "A 40-year-old woman tearfully shares that she had overeaten the previous day. Which of the following is the most appropriate initial response by the coach?", options: ["“Everyone overeats occasionally.”", "“I see your tears; tell me more about what you are feeling.”", "“It sounds like you are struggling with stress.”", "“Would you like a therapist recommendation?”"], answer: 1, logic: "Invite client to recognize the emotion they're feeling." },
        { id: 78, category: "Self-Management • 3.10", q: "A client reports that his father, who died at the age of 48, was overweight and a heavy smoker. The coach’s own father had similar factors and died 2 years ago. Which is the most appropriate initial step?", options: ["Assess ability to be fully present and self-manage emotions", "Provide evidence-based risk info", "Share the personal story to motivate", "Ignore memories"], answer: 0, logic: "Self-awareness allows coach to stay present for client." },
        { id: 79, category: "Final Session • 3.6", q: "A 25-year-old woman consistently exercises and feels confident about her current health. She says she plans to join her friends in training for a half marathon. Most appropriate next step?", options: ["Ask about training plan progress", "Elicit satisfaction feedback", "Explore future goals", "Invite her to reflect on lessons learned during coaching"], answer: 3, logic: "Final sessions honor growth and reflective closure." },
        { id: 80, category: "Action Planning • 3.2", q: "A 52-year-old man brings two recipes with him and plans to set a goal to cook dinner on Tuesday and Thursday nights. After affirming the client’s decision, which is the most appropriate next step?", options: ["Readiness 0-10", "Grocery list", "Explore what additional steps are needed to cook on two nights", "Other 5 nights?"], answer: 2, logic: "Identifies barriers and supports for specific goals." },
        { id: 81, category: "Visioning • 3.13", q: "A 30-year-old woman speaks with the coach because she wants to lose weight. Which is the most appropriate initial step to help her create a vision?", options: ["Past loss?", "Journaling?", "Identify specific goal", "Ask what would be possible if she lost weight"], answer: 3, logic: "Visioning explores possibilities and desired outcomes." },
        { id: 82, category: "Ask-Offer-Ask • 3.14", q: "A 59-year-old man had cardiac bypass surgery 3 weeks ago. The coach is not familiar with bypass procedures. Which is the most appropriate approach?", options: ["Ask what he knows about postoperative precautions", "Disclose unfamiliarity", "Key interest areas", "Daily activity ideas"], answer: 0, logic: "Elicits client understanding and guides coaching." },
        { id: 83, category: "Bottom-Lining • 3.17", q: "A 25-year-old man tells several stories and shares personal details about coworkers. The coach notices the session is not progressing. Which technique?", options: ["Bottom-lining", "Open-ended question", "Simple reflection", "Summarizing"], answer: 0, logic: "Refocuses the conversation on what matters most." },
        { id: 84, category: "Strengths Review • 3.6", q: "A 48-year-old woman goal is to increase physical activity and lose weight. After affirming her past efforts, what is the most appropriate next step?", options: ["Brainstorm", "History gaps", "Review assessment results, health status, and limitations", "Focus areas choose"], answer: 2, logic: "Strengths-based lens supports informed goal setting." },
        { id: 85, category: "Past Success • 3.18", q: "A 57-year-old woman says she can’t seem to fit self-care into her day. After reflecting her statement, which response is best?", options: ["“Are you feeling guilty?”", "“Describe what it was like when you used to fit in self-care activities.”", "“Daily schedule?”", "“Support groups?”"], answer: 1, logic: "Connecting to past success builds insight/confidence." },
        { id: 86, category: "Self-Efficacy • 3.5", q: "Together, coach and client have brainstormed sleep steps. Client: “Turning off electronics earlier was difficult, but I saw the benefits.” Response?", options: ["Sleep study?", "Environment change?", "Which option will you be able to sustain?", "My ideas?"], answer: 2, logic: "Helps client evaluate options for sustainability." },
        { id: 87, category: "Agreement • 1.1", q: "A 53-year-old woman wants the coach to plan a menu and tell her where to shop. Which of the following is the most appropriate next step?", options: ["Identify stores", "Vegan menu plan", "Describe the coaching process, roles, and responsibilities", "Research cookbooks"], answer: 2, logic: "Initial sessions clarify expectations and partnership." },
        { id: 88, category: "Self-Efficacy • 3.5", q: "A 63-year-old woman walked for 20 minutes once last week. Which of the following is the most appropriate next step?", options: ["Ask her to reflect on the time she walked", "Support system?", "Importance remind", "Believe in you"], answer: 0, logic: "Focusing on success enhances confidence." },
        { id: 89, category: "Psychological Safety • 3.11", q: "A 42-year-old woman wants to return to school but worries about time. Which is the most appropriate initial response?", options: ["Accountability guarantee", "Right time?", "Worked with similar person", "“What do you hope to gain from coaching to support this decision?”"], answer: 3, logic: "Establishing safety and eliciting hopes aligns the partnership." },
        { id: 90, category: "Growth Mindset • 3.7", q: "Coach: “It sounds like this is hard for you. You are not strong at marketing yourself yet. You are exploring new horizons...” Demonstrates?", options: ["Appreciative inquiry", "Growth mindset", "Positive psych", "Self-determination"], answer: 1, logic: "Emphasizes effort and potential for growth." },
        { id: 91, category: "Self-Management • 3.10", q: "A 54-year-old woman is grieving the sudden loss of her husband. The coach is recently widowed and becomes distracted by memories. Next step?", options: ["Avoid topic", "Share personal loss", "Educate", "Notice internal experience and stay present"], answer: 3, logic: "Presence requires self-management of coach emotions." },
        { id: 92, category: "Support planning • 3.9", q: "A 34-year-old woman spouse drinks coffee throughout the day, making insomnia change challenging. Response?", options: ["“What are some ways your spouse might support you?”", "Negative effects?", "Get outside?", "Switch decaf?"], answer: 0, logic: "Supports identifying needed social support." },
        { id: 93, category: "Biometric • 2.2", q: "A 38-year-old man: BMI 24, Blood pressure 134/84, Fasting blood glucose 81. Which is outside normal range?", options: ["Blood pressure", "Blood sugar", "BMI", "Weight"], answer: 0, logic: "134/84 is elevated/Stage 1 hypertension." },
        { id: 94, category: "Continuum • 2.3", q: "A 47-year-old man with type 2 diabetes wants to discontinue medication by losing weight. Point on continuum?", options: ["Disability", "Symptoms", "Neutral", "Growth"], answer: 3, logic: "Pursuing self-improvement reflects wellness 'growth'." },
        { id: 95, category: "Presence • 3.1", q: "A 39-year-old man arrives 10 minutes late, out of breath and overwhelmed. Which response is most appropriate?", options: ["Check in differently?", "Wait 5 mins", "Settling exercise", "“What would help you transition smoothly into this session?”"], answer: 3, logic: "Centers presence and invites emotional safety." },
        { id: 96, category: "SDOH • 2.5", q: "A client neighborhood without a grocery store relies on public transportation. Application of SDOH awareness?", options: ["Motivation", "Explore affordable frozen/shelf-stable locally", "Creative reframe", "Meal plan"], answer: 1, logic: "Acknowledges structural barriers and supports realistic adaptation." },
        { id: 97, category: "Boundaries • 1.2", q: "A businessman—with whom the coach previously had a brief sexual relationship—asks to become a coaching client. Response?", options: ["Explain candidate bad", "Start coaching", "Phone sessions only", "Offer referrals to other credentialed coaches"], answer: 3, logic: "Avoiding dual relationships protects client safety." },
        { id: 98, category: "TTM • 2.4", q: "A 49-year-old man says, “My blood sugar was a little high, but I feel great and I don’t think it’s a problem.” Stage?", options: ["Precontemplation", "Contemplation", "Preparation", "Action"], answer: 0, logic: "Does not yet perceive a need for change." },
        { id: 99, category: "Autonomy • 3.8", q: "A 25-year-old woman prefers tracking her habits in a paper calendar rather than a fitness tracker. Construct?", options: ["Autonomy", "Relatedness", "Self-compassion", "Willpower"], answer: 0, logic: "Reinforces client ownership of decisions." },
        { id: 100, category: "Referral • 1.6", q: "A 45-year-old woman laid off, appears sad, slumped, disheveled, and says: “Life is too hard right now; I don’t see it getting better.” Next step?", options: ["Referral to mental health professional", "Reach out support", "Redirect positive", "Reflect strengths"], answer: 0, logic: "Presentation indicates possible depression needing referral." },
        { id: 101, category: "Reflection • 3.16", q: "A 50-year-old woman overeats when stressed and appears overwhelmed. Which is the most appropriate coach response?", options: ["Losing weight benefits info", "Direction from me?", "Ready to lose weight", "“You believe it will not be easy, and you would like to lose weight.”"], answer: 3, logic: "Double-sided reflection acknowledges struggle and desire." },
        { id: 102, category: "Habit Science • 2.4", q: "A client says, “I try starting a morning walk, but after three days I forget. Maybe I’m just not disciplined.” Response reflects neuroplasticity?", options: ["Discipline improves", "“Your brain strengthens habits through repetition and cues, not willpower alone.”", "Brain types", "Restart later"], answer: 1, logic: "Habits form through consistent cues and repetition." },
        { id: 103, category: "PA Guidelines • 2.1", q: "To receive health benefits, at least how many minutes of moderate-intensity aerobic activity per week for adults?", options: ["90", "150", "180", "210"], answer: 1, logic: "Standard guideline is 150 minutes per week." },
        { id: 104, category: "Confidentiality • 1.1", q: "A 36-year-old woman asks how the coach can share information with her doctor. Response?", options: ["I cannot share", "“You can sign a release form allowing me to share information.”", "Share only medical", "Verbal approval"], answer: 1, logic: "Signed release is required for information sharing." },
        { id: 105, category: "Self-Efficacy • 3.5", q: "A 30-year-old woman rates her confidence in 20 mins relaxation daily at a 7. Which is the most appropriate next response?", options: ["Sure?", "Increase to 10?", "“Why did you rate your confidence a 7 and not a 5?”", "Why a 7 and not a 9?"], answer: 2, logic: "Focuses on existing strengths supporting current confidence." },
        { id: 106, category: "Autonomy • 3.11", q: "A 52-year-old woman calls immediately expressing fear that her blood sugar is too high. Next step?", options: ["Adjust eating?", "“What would you like to focus on today?”", "Goal is sleep", "Diabetes concerns"], answer: 1, logic: "Letting client choose honors autonomy." },
        { id: 107, category: "Reflective Practice • 3.6", q: "A 28-year-old advertising executive, final session. What is the most appropriate next step to help her reflect?", options: ["Stay positive", "Uncompleted goals", "Testimonial?", "Ask what she has learned from the coaching experience"], answer: 3, logic: "Reflection deepens insight and reinforces change." },
        { id: 108, category: "Grounding • 3.1", q: "A 66-year-old man arrives late, on his phone, and frazzled. What is the most appropriate strategy?", options: ["Extend session", "Leave phone", "Time management", "Offer a brief deep-breathing exercise"], answer: 3, logic: "Grounding helps client become present." },
        { id: 109, category: "Safety • 2.2", q: "A 52-year-old woman continues sweating 3 hours later, feels dizzy, heart racing, and words sound slurred. Response?", options: ["Call later", "See doc soon", "Reschedule", "“You need urgent care immediately; symptoms may indicate very low blood sugar.”"], answer: 3, logic: "Symptoms signal medical emergency (hypoglycemia)." },
        { id: 110, category: "Reframing • 3.15", q: "A 50-year-old man says his son frequently reminds him to exercise, which annoys him. Which response reframes?", options: ["Don't like nagging", "Want to be active", "“Your son seems to care about your health.”", "Broken record"], answer: 2, logic: "Shifts perception from annoyance to support." },
        { id: 111, category: "Strengths • 3.6", q: "A client’s top strengths are fairness and creativity. Low strengths are perseverance and zest. Approach?", options: ["Social interactions", "Gratitude journal", "Breathing", "Explore strengths to find creative ways to meet goals"], answer: 3, logic: "Strengths increase motivation/confidence." },
        { id: 112, category: "Skill Transfer • 3.21", q: "A 46-year-old man shares his successful morning routine success. Coach asks: “What helped you be consistent with your morning habits?” Purpose?", options: ["Values link", "Apply his skills to a new situation", "Decisional balance", "Strengths remind"], answer: 1, logic: "Transfers skills from one domain to another." },
        { id: 113, category: "Growth Mindset • 3.7", q: "A 52-year-old woman says she can succeed because she has done it before. Which framework?", options: ["Decisional balance", "Growth mindset", "MI", "Social cognitive theory"], answer: 1, logic: "Growth mindset focuses on capability and learning." },
        { id: 114, category: "Visioning • 3.13", q: "A 45-year-old man says: “I’ve been smoking for so long. It’s hard to imagine giving it up, but I know I want to quit.” Response?", options: ["How much spent?", "“What do you imagine could be possible for you when you quit?”", "Health risks?", "Quit for one day?"], answer: 1, logic: "Elicits visioning toward a desired future." },
        { id: 115, category: "Ask-Offer-Ask • 3.14", q: "A 50-year-old woman wants to make her health a priority. The coach starts exploring wellness. Most appropriate question to begin?", options: ["“What does ‘wellness’ mean to you at this time in your life?”", "Past health problems?", "Family history?", "Risk factors?"], answer: 0, logic: "Elicits client's baseline understanding/meaning." },
        { id: 116, category: "Simple Reflection • 3.16", q: "A 79-year-old man worries he’ll forget to write the grocery list on weekends. Response?", options: ["Memory issues?", "Aging research", "Worst case?", "“You are worried you might not follow through because you may forget.”"], answer: 3, logic: "Accurately acknowledges the specific concern." },
        { id: 117, category: "Records • 1.1", q: "A 64-year-old woman asks to review the coach’s notes from her first few sessions. Response?", options: ["After finishing", "Not comfortable", "Forward looking better", "“I can bring the notes to our next session and we can review them together.”"], answer: 3, logic: "Access to notes is a right; review supports partnership." },
        { id: 118, category: "Ask-Offer-Ask • 3.14", q: "A 48-year-old man asks about PSA screening: “Should I be worried?” Response?", options: ["No big deal", "Pamphlet review", "Inappropriate for me", "“Tell me what you currently know about PSA tests.”"], answer: 3, logic: "Elicits client's current knowledge baseline." },
        { id: 119, category: "Ask-Offer-Ask • 3.14", q: "A 62-year-old man says: “My doctor wants me to see you for gout. He tells me what to do, and he says you can help.” After a simple reflection, what next?", options: ["“What do you know about gout?”", "Goals most important?", "Role you want to play?", "Small steps?"], answer: 0, logic: "Starts with client perspective/knowledge." },
        { id: 120, category: "Goal Setting • 3.2", q: "A 35-year-old man loves the visioning process and resists setting a first goal. Which response is most appropriate?", options: ["Can't support without goal", "Manifest vision", "Time to move", "“What part of this vision could you turn into reality first?”"], answer: 3, logic: "Narrows vision into an actionable starting point." },
        { id: 121, category: "Past Success • 3.18", q: "A 36-year-old woman wants to avoid further setbacks after running injuries. Which question?", options: ["“What helped you avoid injuries in the past?”", "Physical therapist?", "PCP role?", "Who supported?"], answer: 0, logic: "Past success builds confidence and strategy." },
        { id: 122, category: "Goal Adjustment • 3.2", q: "A 34-year-old business executive is stressed and worries about maintaining weight-loss progress. The coach suggests it may help to reconsider expectations. Reflects?", options: ["Adjusting goals", "Affirming ambivalence", "Positive amplify", "Fostering self-compassion"], answer: 0, logic: "Supports realistic planning for challenging periods." },
        { id: 123, category: "Collaboration • 1.4", q: "A coach attends a cardiology conference where new blood pressure guidelines were announced. What is the most appropriate next step?", options: ["Give info immediately", "Seminar for coaches", "Consult with the cardiologists in the practice", "Wait for workshop"], answer: 2, logic: "Ensures consistent, accurate medical information." },
        { id: 124, category: "Agreement • 1.1", q: "Which of the following is mandatory to include in any coaching agreement?", options: ["Client and coach responsibilities", "Testimonials", "Expertise areas", "Guarantee of outcomes"], answer: 0, logic: "Agreements must define roles and responsibilities." },
        { id: 125, category: "TTM • 2.2", q: "A 55-year-old woman walked three times, exceeding her goal of twice weekly. She wants to walk four times next week. Stage?", options: ["Precontemplation", "Contemplation", "Preparation", "Action"], answer: 3, logic: "Actively performing and increasing the behavior." },
        { id: 126, category: "Autonomy • 3.8", q: "A 32-year-old woman says her doctor didn’t explain metabolic syndrome fully and she wants to learn more. Response?", options: ["Another appointment?", "How proceed when know more?", "“What can you do to learn more about metabolic syndrome?”", "Website suggestion?"], answer: 2, logic: "Supports autonomy in seeking information." },
        { id: 127, category: "Presence • 3.1", q: "A phone session with a client is about to begin. A coach has not checked email. What action ensures coach is calm?", options: ["During silence", "Ask permission", "Reply many", "Scan email for any message from this client"], answer: 3, logic: "Supports readiness for current client without distraction." },
        { id: 128, category: "Boundaries • 1.2", q: "A 54-year-old man consistently arrives late to coaching sessions. Today he is 30 minutes late for a 45-minute session. Response?", options: ["Your time", "“May we take a moment? These late starts feel disrespectful to my time.”", "Make best use", "Still accomplish lot"], answer: 1, logic: "Boundary setting strengthens professional relationship." },
        { id: 129, category: "Boundaries • 1.2", q: "A coach offers to watch the client’s three children while the client goes out. Which ethical principle is most likely violated?", options: ["Confidentiality", "Conflict of interest", "Professional boundaries", "Scope of practice"], answer: 2, logic: "Dual relationships blur boundaries and create ethical risk." },
        { id: 130, category: "Scope • 1.3", q: "A personaltrainer-coach believes they are qualified to prescribe a nutrition plan to a client after a webinar. Violation?", options: ["Credentials", "Dual roles", "Conflict", "Scope of practice"], answer: 3, logic: "Coaches cannot prescribe diets or meal plans." },
        { id: 131, category: "Strengths • 3.6", q: "A 56-year-old woman enthusiastically shares a list of twelve activities she enjoyed in the past. Response?", options: ["No wrong choice", "Ready to move", "“You enjoyed exploring what is possible.”", "Work to do"], answer: 2, logic: "Affirms motivation and supports exploration." },
        { id: 132, category: "ROI • 1.1", q: "A 36-year-old woman asks: “What if I want you to share information with my doctor?” Correct response?", options: ["I cannot share", "“You can sign a form giving me permission to share information.”", "Medical only", "Verbal okay"], answer: 1, logic: "Signed release required for sharing information." },
        { id: 133, category: "Growth Mindset • 3.7", q: "A 43-year-old woman reports only taking one deep breath a few times instead of three and feels discouraged. Next step?", options: ["Try again", "Stressful events?", "New goal", "Explore the positive experiences she had when she did take the breath"], answer: 3, logic: "Focusing on what worked reinforces growth mindset." },
        { id: 134, category: "Discord • 3.11", q: "A 65-year-old man agitated about politics uses expletives and asks the coach about the coach’s beliefs. Response to address discord?", options: ["Passionate also, refer out", "My beliefs won't lower stress", "Support rights", "“It sounds like you have some strong feelings about these issues.”"], answer: 3, logic: "Curiosity (not defensiveness) repairs discord." },
        { id: 135, category: "Awareness • 3.4", q: "A 45-year-old woman says: “I am disappointed in myself and worried about how my family is being impacted.” Response?", options: ["Manage better", "“This is a difficult time for you. You’re not responding how you’d like, and it’s affecting you and those you care about.”", "Unfortunate setback", "Different tools?"], answer: 1, logic: "Acknowledges whole person and validates feelings." },
        { id: 136, category: "Accountability • 3.9", q: "A coach must unexpectedly travel for a week due to a family medical crisis. What is the most appropriate action?", options: ["Ask the client how she might get support aside from texting during the coach’s absence", "Other coach respond", "Continue texting", "Inform unavailable"], answer: 0, logic: "Preserves continuity while promoting self-accountability." },
        { id: 137, category: "Nonverbal • 3.12", q: "A 43-year-old manReviewing his progress he shifts posture, squeezes his fingers, exhales, and appears uneasy. Purpose of naming it?", options: ["Analyzing behavior", "Attending to nonverbal cues", "Problem solving", "Exploring progress"], answer: 1, logic: "Acknowledges and brings awareness to nonverbal signals." },
        { id: 138, category: "Continuum • 2.3", q: "A 43-year-old man seeking support wellbeing after long-term alcohol struggles has not had alcohol for two weeks. Point?", options: ["Neutral", "Paradigm not moving", "Treatment Paradigm moving toward Neutral Point", "Wellness toward High-Level"], answer: 2, logic: "Moving toward neutral from the treatment/illness side." },
        { id: 139, category: "Visioning • 3.13", q: "A coach begins each session with a guided imagery exercise in which the client visualizes their “best self.” What is the coach elicting?", options: ["Environment", "Intrinsic motivation", "Mindfulness", "Self-compassion"], answer: 1, logic: "Visioning strengthens intrinsic motivation/belief in possibility." },
        { id: 140, category: "Prep • 3.1", q: "What should a coach do before a second phone session with a 31-year-old client with HIV?", options: ["Contact PCP", "Review assessments and communications from the client", "Literature review", "Bias self-assess"], answer: 1, logic: "Reviewing materials demonstrates care and continuity." },
        { id: 141, category: "Ethics • 1.5", q: "A coach is also an aromatherapist and distributor. She frequently recommends her own brand without disclosing financial involvement. Violation?", options: ["Confidentiality", "Conflict of interest", "Consent", "Boundaries"], answer: 1, logic: "Financial interests must be disclosed to client." },
        { id: 142, category: "Self-Efficacy • 3.5", q: "When asked to rate confidence in a 200 calorie reduction on a 0–10 scale, a 26-year-old man says 6. Next step?", options: ["Brainstorm", "Explore what would increase his confidence", "Accountability", "Resources?"], answer: 1, logic: "6 indicates ambivalence; explore how to strengthen confidence." },
        { id: 143, category: "Positive Reframe • 3.7", q: "A 47-year-old man in his tenth session for weight loss says, “I must just be lazy; I keep giving up.” Reframe response?", options: ["Learned process?", "“No matter the setbacks, you continue finding new strategies.”", "Not lazy, frustration", "Common experience"], answer: 1, logic: "Uses positive, affirming language to shift identity." },
        { id: 144, category: "Metrics • 2.2", q: "Which of the following health metrics is a screening measure of body fat based on height and weight?", options: ["Bioelectrical impedance", "Body mass index", "Hydrostatic weighing", "Skinfold"], answer: 1, logic: "BMI is a screening tool based on height/weight." },
        { id: 145, category: "Bottom-Lining • 3.2", q: "A 56-year-old man proposes several vague steps he will “decide during the week.” This has been his approach for 3 sessions. Next step?", options: ["Ask client to bottom-line one action he can commit to", "Share responsibilities", "Cut commitments", "Support vague desire"], answer: 0, logic: "Specificity increases commitment and reduces avoidance." },
        { id: 146, category: "Perspective • 3.7", q: "The coach asks, “What new activities might your inner athlete like to try?” Which technique?", options: ["Discerning needs", "Eliciting new perspectives", "Not said", "Energy tuning"], answer: 1, logic: "Invites new possibilities and reframes identity." },
        { id: 147, category: "Role Modeling • 3.6", q: "Which of the following best describes the reason for a health and wellness coach to “walk the talk”?", options: ["Masterful self-care energy", "Outcomes respect", "Conviction support", "Difficult models"], answer: 0, logic: "Embodied wellness inspires through authenticity/energy." },
        { id: 148, category: "Autonomy • 3.11", q: "A 56-year-old woman reports increased comfort-food intake after her husband unexpectedly asked for a divorce. Response?", options: ["Stress strategy", "Temptation activity?", "Marriage counselor?", "“You’re going through a lot right now. What would you like to focus on today?”"], answer: 3, logic: "Honors autonomy during emotional crisis." },
        { id: 149, category: "3.4 Perspective", q: "A client who works at a high-stress bank reports they 'binge' on sweets during the drive home. Coach: 'What one change to your environment would help?' Type?", options: ["Providing advice", "Stimulus control", "Social support", "Willpower boost"], answer: 1, logic: "Environmental changes to reduce cues for bad habits is stimulus control." },
        { id: 150, category: "5.3 Prevention", q: "According to current guidelines, what is considered a 'normal' blood pressure reading for an adult?", options: ["<120/80 mmHg", "130/80 mmHg", "140/90 mmHg", "120/90 mmHg"], answer: 0, logic: "AHA/CDC guidelines define normal as systolic <120 AND diastolic <80." }
    ];

    // App State
    let questionsOrder = [...rawQuestions];
    let userAnswers = {}; 
    let currentIndex = 0; 
    let isDarkMode = false;

    // Elements
    const quizArea = document.getElementById('quiz-area');
    const questionGrid = document.getElementById('question-grid');
    const statCompleted = document.getElementById('stat-completed');
    const statAccuracy = document.getElementById('stat-accuracy');
    const statCorrect = document.getElementById('stat-correct');
    const fillCorrect = document.getElementById('fill-correct');
    const fillWrong = document.getElementById('fill-wrong');
    const percentLabel = document.getElementById('percent-label');

    function shuffle(array) {
        let m = array.length, t, i;
        while (m) {
            i = Math.floor(Math.random() * m--);
            t = array[m];
            array[m] = array[i];
            array[i] = t;
        }
        return array;
    }

    function initGrid() {
        questionGrid.innerHTML = '';
        questionsOrder.forEach((q, i) => {
            const item = document.createElement('div');
            item.className = 'grid-item';
            item.innerText = i + 1;
            item.id = `grid-item-${i}`;
            item.onclick = () => jumpToQuestion(i);
            questionGrid.appendChild(item);
        });
        updateGridStatus();
    }

    function jumpToQuestion(index) {
        currentIndex = index;
        renderQuestion();
    }

    function renderQuestion() {
        const q = questionsOrder[currentIndex];
        const previousAnswer = userAnswers[q.id];
        
        quizArea.innerHTML = `
            <div class="question-card">
                <div class="category">${q.category}</div>
                <div class="question-text">${q.q}</div>
                <div class="options-grid">
                    ${q.options.map((opt, i) => {
                        let cls = 'option';
                        if (previousAnswer) {
                            cls += ' disabled';
                            if (i === q.answer) cls += ' correct';
                            else if (i === previousAnswer.chosen && !previousAnswer.correct) cls += ' wrong';
                        }
                        return `<button class="${cls}" onclick="handleChoice(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`;
                    }).join('')}
                </div>
                <div class="explanation ${previousAnswer ? 'visible' : ''}" id="explanation">
                    <p><strong>Correct Answer: ${String.fromCharCode(65 + q.answer)}</strong></p>
                    <p>${q.logic}</p>
                </div>
            </div>
        `;
        
        updateGridStatus();
        updateStats();
        
        document.getElementById('prev-btn').disabled = currentIndex === 0;
        document.getElementById('next-btn').innerText = currentIndex === questionsOrder.length - 1 ? "Start Over" : "Next Question →";
    }

    function handleChoice(index) {
        const q = questionsOrder[currentIndex];
        if (userAnswers[q.id]) return;
        
        const isCorrect = index === q.answer;
        userAnswers[q.id] = { chosen: index, correct: isCorrect };
        
        renderQuestion();
    }

    function updateGridStatus() {
        document.querySelectorAll('.grid-item').forEach((item, i) => {
            const q = questionsOrder[i];
            item.classList.remove('active', 'correct', 'wrong');
            if (i === currentIndex) item.classList.add('active');
            if (userAnswers[q.id]) {
                item.classList.add(userAnswers[q.id].correct ? 'correct' : 'wrong');
            }
        });
    }

    function updateStats() {
        const answeredIds = Object.keys(userAnswers);
        const correctCount = answeredIds.filter(id => userAnswers[id].correct).length;
        const totalTried = answeredIds.length;
        const wrongCount = totalTried - correctCount;
        const totalTotal = questionsOrder.length;

        statCompleted.innerText = `${totalTried} / ${totalTotal}`;
        statCorrect.innerText = correctCount;
        
        const accuracy = totalTried > 0 ? Math.round((correctCount / totalTried) * 100) : 0;
        statAccuracy.innerText = `${accuracy}%`;
        
        const totalPercent = Math.round((totalTried / totalTotal) * 100);
        percentLabel.innerText = `${totalPercent}% Done`;
        
        fillCorrect.style.width = `${(correctCount / totalTotal) * 100}%`;
        fillWrong.style.width = `${(wrongCount / totalTotal) * 100}%`;
    }

    document.getElementById('next-btn').onclick = () => {
        if (currentIndex < questionsOrder.length - 1) {
            currentIndex++;
            renderQuestion();
            window.scrollTo(0,0);
        } else {
            if (confirm("Finish and restart?")) {
                currentIndex = 0;
                renderQuestion();
            }
        }
    };

    document.getElementById('prev-btn').onclick = () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
            window.scrollTo(0,0);
        }
    };

    document.getElementById('shuffle-btn').onclick = () => {
        shuffle(questionsOrder);
        currentIndex = 0;
        initGrid();
        renderQuestion();
        const msg = document.createElement('div');
        msg.style = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:white; padding:10px 20px; border-radius:30px; font-weight:bold; z-index:1000;";
        msg.innerText = "Order Shuffled!";
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    };

    document.getElementById('reset-btn').onclick = () => {
        if (confirm("Reset all progress?")) {
            userAnswers = {};
            currentIndex = 0;
            renderQuestion();
            initGrid();
        }
    };

    document.getElementById('theme-btn').onclick = () => {
        isDarkMode = !isDarkMode;
        document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
    };

    document.getElementById('toggle-grid-btn').onclick = function() {
        const isHidden = questionGrid.style.display === 'none';
        questionGrid.style.display = isHidden ? 'grid' : 'none';
        this.innerText = isHidden ? 'Hide Grid' : 'Show Grid';
    };

    initGrid();
    renderQuestion();
</script>
</body>
</html>
