<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBHWC Midnight Mastery - Unified Study Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; 
            color: #f1f5f9;
            min-height: 100vh;
        }

        .category-tag {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 9999px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cat-1 { background-color: #064e3b; color: #6ee7b7; border: 1px solid #10b981; } /* Presence */
        .cat-2 { background-color: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; } /* Behavior */
        .cat-3 { background-color: #78350f; color: #fcd34d; border: 1px solid #f59e0b; } /* Skills */
        .cat-4 { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; } /* Ethics */
        .cat-5 { background-color: #4c1d95; color: #c4b5fd; border: 1px solid #8b5cf6; } /* Science */

        .case-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #0f172a;
            border: 1px solid #1e293b;
        }
        .case-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: #334155;
            background-color: #1e293b;
        }
        .case-card.solved-correct { border-left: 4px solid #10b981; }
        .case-card.solved-wrong { border-left: 4px solid #ef4444; }

        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: #1e293b;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }

        .option-item {
            cursor: pointer;
            border: 2px solid #1e293b;
            background: #0f172a;
            transition: all 0.2s;
        }
        .option-item:hover { border-color: #3b82f6; background: #1e293b; }
        .option-item.correct { border-color: #10b981; background: #064e3b; color: #d1fae5; }
        .option-item.wrong { border-color: #ef4444; background: #7f1d1d; color: #fee2e2; }
        .option-item.disabled { pointer-events: none; }

        .mastery-pill {
            font-size: 0.7rem;
            padding: 4px 12px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-10">
            <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6">
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tighter uppercase">Midnight <span class="text-blue-500">Mastery</span></h1>
                    <p class="text-slate-400 mt-1 font-medium italic">NBHWC Certification Simulator • Full 75-Scenario Set</p>
                </div>
                
                <div class="flex flex-wrap gap-3">
                    <div class="mastery-pill shadow-lg">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span class="text-slate-400">Mastered: <b id="stat-correct" class="text-emerald-400">0</b></span>
                    </div>
                    <div class="mastery-pill shadow-lg">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        <span class="text-slate-400">Accuracy: <b id="stat-accuracy" class="text-blue-400">0%</b></span>
                    </div>
                    <button onclick="resetStats()" class="text-[10px] text-slate-500 hover:text-rose-500 font-bold uppercase tracking-widest border border-slate-800 px-3 py-1 rounded-md transition-all">Reset Stats</button>
                </div>
            </div>

            <div class="mt-8 grid grid-cols-1 md:grid-cols-5 gap-4">
                <div class="col-span-1 md:col-span-2 bg-slate-900/50 p-5 rounded-2xl border border-slate-800 shadow-xl">
                    <div class="flex justify-between text-xs mb-3">
                        <span class="font-bold text-slate-500 uppercase tracking-widest">Exam Completion</span>
                        <span id="progress-text" class="text-emerald-400 font-bold">0/75</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
                <div id="category-mastery" class="col-span-1 md:col-span-3 flex gap-2 overflow-x-auto pb-2 no-scrollbar scroll-smooth">
                    <!-- Category status -->
                </div>
            </div>
        </header>

        <!-- Tools & Search -->
        <div class="sticky top-4 z-40 bg-slate-900/80 backdrop-blur-xl p-4 rounded-2xl shadow-2xl border border-slate-800 mb-8 flex flex-col md:flex-row gap-4 items-center">
            <div class="relative w-full md:w-1/3">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="search-input" placeholder="Keyword search in scenarios..." 
                       class="block w-full pl-12 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none transition-all text-sm text-slate-200">
            </div>
            
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto no-scrollbar">
                <button onclick="filterCases(0)" class="filter-btn active whitespace-nowrap bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest">All Pools</button>
                <button onclick="filterCases(1)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Presence</button>
                <button onclick="filterCases(2)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Behavior</button>
                <button onclick="filterCases(3)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Skills</button>
                <button onclick="filterCases(4)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Ethics</button>
                <button onclick="filterCases(5)" class="filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white">Science</button>
            </div>

            <div class="ml-auto flex items-center">
                <button onclick="shuffleBoard()" class="flex items-center gap-2 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-emerald-600 hover:text-white transition-all shadow-lg shadow-emerald-900/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Shuffle Board
                </button>
            </div>
        </div>

        <div id="case-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20"></div>
    </div>

    <!-- Case Modal -->
    <div id="case-modal" class="modal-overlay">
        <div class="bg-slate-900 rounded-[2.5rem] shadow-2xl max-w-3xl w-full max-h-[95vh] overflow-y-auto relative border border-slate-800">
            <button onclick="closeModal()" class="fixed md:absolute top-4 right-4 p-3 bg-slate-800 rounded-full text-slate-400 hover:text-white z-50 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="p-8 md:p-14">
                <div class="flex items-center gap-3 mb-6">
                    <div id="modal-category" class="category-tag">Category</div>
                    <span id="modal-id" class="text-xs font-mono text-slate-600 tracking-tighter">Case ID: --</span>
                </div>
                
                <div id="modal-title" class="text-lg md:text-xl text-slate-200 mb-10 leading-relaxed font-medium bg-slate-950 p-8 rounded-3xl border border-slate-800 shadow-inner whitespace-pre-line">
                    <!-- Full Scenario Text -->
                </div>
                
                <div id="options-container" class="space-y-4 mb-12"></div>

                <div id="feedback-section" class="hidden">
                    <div class="p-8 bg-blue-600/10 rounded-3xl border border-blue-600/30">
                        <div class="flex items-center gap-3 mb-4">
                            <svg class="w-6 h-6 text-blue-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                            <h4 class="text-xs font-black uppercase tracking-[0.2em] text-blue-400">Board Logic Explanation</h4>
                        </div>
                        <p id="explanation-text" class="text-slate-300 leading-relaxed text-sm md:text-base"></p>
                    </div>
                    <button onclick="closeModal()" class="mt-8 w-full bg-emerald-600 text-white py-5 rounded-3xl font-black text-xl hover:bg-emerald-500 uppercase tracking-widest">Next Challenge</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const nbhwcDataset = [
            { id: 1, cat: 3, title: "Stress & BP Proactivity", text: "A 52-year-old man meets with the coach at the company’s on-site wellness clinic for the second session to increase the level of exercise and reduce stress in order to lower the blood pressure. The client says the client is very concerned that if the client does not get the blood pressure in check, the client may end up having a stroke like the client's father. The client appears to be upset. Which of the following is the most appropriate next step by the coach?", options: ["Affirm the client for being proactive", "Provide a positive reframe", "Suggest meditation to reduce stress", "Use appropriate silence"], answer: 0, explanation: "Affirming client’s behaviors builds confidence and self-efficacy." },
            { id: 2, cat: 1, title: "Cancer Story & Curiosity", text: "A 60-year-old woman meets with the coach via videoconferencing for the first session. The client was recently diagnosed with breast cancer and was referred to the coach by the cancer support group coordinator. The client is interested in implementing healthy lifestyle changes. A section of their conversation is shown:\n\nClient: I am sure you have heard cancer stories over and over again.\nCoach: Many survivors do share similar experiences and feelings when they learn they have cancer.\nClient: Yes, and I do not want to bore you with all the sad details.\nCoach: You are concerned I have already heard it all before. Your story is important. What did it feel like to learn you have cancer?\n\nWhich technique best describes the coach’s response?", options: ["Affirming the client’s emotional state", "Assessing resilience", "Demonstrating curiosity without assumptions", "Redirecting focus", "Shifting perspective"], answer: 2, explanation: "Coach uses a 'not-knowing' mindset: getting curious and supporting the client as the expert." },
            { id: 3, cat: 1, title: "Cancer Remission Priorities", text: "A 38-year-old woman speaks with the coach on the phone for the first session. The client completed chemotherapy and radiation therapy for breast cancer and is now in remission. The client tells the coach that the client is concerned about a relapse and wants to integrate new healthy behaviors into daily routines, including cardiovascular exercise, strength training, sleeping at least 7 hours nightly, stress management, and having fun with friends again. Which is the most appropriate response?", options: ["How will you know that you have achieved your goals?", "Let us take a look at your readiness for each area.", "Shall we start with exploring stress management?", "Which of the areas feels most important?"], answer: 3, explanation: "Helps the client get clearer on what matters most and where they want to go first." },
            { id: 4, cat: 2, title: "Past Success & Mindset", text: "A 57-year-old woman meets with the coach for the third session for prediabetes. During the session, the client selects the goal of replacing juice and soda with non-sugary beverages. The client says that the client knows the client can do it because the client has learned from past experience that when the client makes the choice and puts in the effort, the client can be successful. Theory?", options: ["Decisional balance", "Growth mindset", "Motivational interviewing", "Social cognitive theory", "Transtheoretical Model"], answer: 1, explanation: "Reflecting on strengths and previous growth demonstrates a capacity to learn from experience." },
            { id: 5, cat: 5, title: "Illness-Wellness Energy", text: "A 36-year-old man meets with the coach at the PCP's office. PCP said biometric results were normal. During the session, the client says that the client does not eat a healthy diet or exercise regularly. The client says, “I may seem healthy, but I notice that I do not have the energy that I used to.” Position on Illness-Wellness Continuum?", options: ["Treatment Paradigm, but not moving", "Neutral Point moving toward Treatment", "Neutral Point", "Neutral Point moving toward Wellness", "High-Level Wellness"], answer: 1, explanation: "Normal labs = Neutral Point. Poor diet and low energy = Moving closer to treatment." },
            { id: 6, cat: 1, title: "Multiple Team Coaches", text: "A 19-year-old collegiate softball player comes to the coach’s office. She says, “I came because my professor suggested it. However, I already have a head coach, two assistant coaches, and a conditioning coach. Why would I consider adding another coach?” Response?", options: ["Come see me after softball season.", "Team coaches specialize; a wellness coach explores overall well-being.", "I encourage you to trust your intuition.", "Continue with current coaches."], answer: 1, explanation: "Clarifies the unique holistic role of a health and wellness coach." },
            { id: 7, cat: 3, title: "Evening Nibbling Patterns", text: "A 55-year-old woman meets with the coach at the PCP's office for her ninth weekly session. She says, “I realize my eating patterns are not in line with my goals. I typically eat well during the day and have a healthy dinner, but then I tend to nibble all evening until bedtime.” Next step for action plan?", options: ["Track calories between dinner and bedtime.", "Brainstorm healthy foods to eat at night.", "Investigate potential triggers for eating after dinner.", "Review the wellness vision."], answer: 2, explanation: "Strategy is to explore patterns by observing behavior and possible triggers." },
            { id: 8, cat: 3, title: "Smoking & Family Choice", text: "A 32-year-old woman meets with the coach at the PCP's office to work on smoking cessation. She smoked one pack daily for 17 years. She does not want to quit, but is conflicted because she and her partner recently decided to start a family. Which tool is most likely to help?", options: ["Bottom-lining", "Confidence scale", "Decisional balance", "Self-compassion"], answer: 2, explanation: "Decisional balance explores perceived pros and cons of changing behavior." },
            { id: 9, cat: 1, title: "Retirement Vision Steps", text: "A 65-year-old man meets the coach for his second session about healthy retirement fun. He shares a big wish list of travel, marathons, safaris, and volunteering. Coach reflects: “You are taking advantage of newfound freedom.” After establishing a vision, next step?", options: ["Assess confidence in completing the list", "Co-create a progress chart", "Define an action step", "Identify accountability partner", "Work with the client to create a SMART goal"], answer: 4, explanation: "SMART goals are the natural next step after establishing a vision." },
            { id: 10, cat: 2, title: "Defeated Runner Mindset", text: "A 30-year-old man speaks with the coach for the fifth session about a 5-km race. He's unhappy with progress and appears defeated: “I am just not meant to be a runner. I cannot do this.” Next step to nurture growth mindset?", options: ["Agree that some are not natural runners", "Create a relapse plan", "Encourage positive thinking", "Explore what the client has learned from persistent training"], answer: 3, explanation: "Meeting doubt with curiosity about learnings invites a growth mindset." },
            { id: 11, cat: 5, title: "Metabolic Syndrome Findings", text: "Which clinical findings are most indicative of a diagnosis of metabolic syndrome?", options: ["High HDL, high fasting sugar, high waist", "High triglycerides, high waist, high blood pressure", "High triglycerides, high fasting sugar, low blood pressure", "Low HDL, low triglycerides, high blood pressure"], answer: 1, explanation: "Metabolic syndrome requires 3 of 5 specific elevated biometric markers." },
            { id: 12, cat: 3, title: "Meditation Goal Reflection", text: "A 45-year-old man says: “I was not able to complete my goal this week. I had a few bad days at work, and I was only able to meditate on four mornings. I am not feeling very positive.” After reflection, coach response?", options: ["Let us talk about success next week.", "Adjust the goal to fit schedule.", "Tell me about how you felt when you did it.", "You did really well to meditate on four mornings."], answer: 3, explanation: "Acknowledging efforts increases resilience and self-efficacy." },
            { id: 13, cat: 4, title: "Privacy & Shared Doctors", text: "A 45-year-old man with hypertension is worried about privacy because he and his partner share the same doctor. “If I see you, will you share our talk with my doctor?” Most appropriate response?", options: ["“Discussions are confidential, unless I need to report risk of harm.”", "“I promise not to tell your doctor anything.”", "“Best if we all share information openly.”", "“I am not an expert in marital issues.”"], answer: 0, explanation: "Validates concern and clearly states the legal/ethical limits of confidentiality." },
            { id: 14, cat: 3, title: "Caregiver Frustration", text: "A 79-year-old with mild dementia feels good about changes but says her daughter treats her like a child. Coach: “You feel much better. You are also frustrated with your daughter because she wants you to do even more.” Skill?", options: ["Amplified reflection", "Double-sided reflection", "Recall", "Simple reflection"], answer: 1, explanation: "Double-sided reflection captures opposing feelings (success vs frustration)." },
            { id: 15, cat: 2, title: "Evoking Motivation", text: "A 58-year-old woman says: “I cannot believe I have made it this far, but I am not sure I can keep this up.” Coach: “What would make it worthwhile to maintain this routine?” Demonstrates which concept?", options: ["Creating partnership", "Encouraging acceptance", "Evoking importance", "Providing affirmation", "Showing compassion"], answer: 2, explanation: "Coach draws out values and emotional drivers to strengthen investment." },
            { id: 16, cat: 3, title: "Promotion & Family Balance", text: "A 45-year-old woman is offered a 'dream job' promotion requiring travel. She worries family life will suffer. Most appropriate next step?", options: ["Ask about dream job aspects", "Assist in evaluating short/long term benefits and consequences", "Identify colleagues for advice", "Explore other job opportunities"], answer: 1, explanation: "Invites client to weigh pros and cons before making a significant decision." },
            { id: 17, cat: 3, title: "School Timing Benefits", text: "A 42-year-old woman wants school but works full-time with 4 teenagers. Response to encourage self-discovery?", options: ["Wait until kids are older?", "Would kids support you?", "Is it realistic?", "Benefits of going now, and what would you lose if you didn't?"], answer: 3, explanation: "Decisional balance question to help her weight timing and priority." },
            { id: 18, cat: 3, title: "Scaling for Walk Goal", text: "A 40-year-old woman sets a goal to walk 10 mins 3x/week. To determine ability to meet this, most appropriate approach?", options: ["How long thinking about starting?", "How will you reward yourself?", "Rate confidence using a 10-point scale", "Write down pros and cons"], answer: 2, explanation: "Confidence scaling determines if the goal timing and difficulty are appropriate." },
            { id: 19, cat: 1, title: "Unconditional Positive Regard", text: "A 49-year-old woman struggles with smoking quit plan after mother's stroke. Coach: “Even though stress caused struggle, you worked hard.” Skill?", options: ["Curiosity", "Bottom-lining", "Conveying unconditional positive regard", "Identifying values", "Listening for what's not said"], answer: 2, explanation: "Accepting and valuing the client without conditions regardless of struggle." },
            { id: 20, cat: 5, title: "Preventable Death Cause", text: "According to the CDC, which is the most common preventable cause of death in the United States?", options: ["Alcohol use", "Firearm incidents", "Illicit drugs", "Obesity", "Tobacco use"], answer: 4, explanation: "Cigarette smoking remains the leading preventable cause of death/disease." },
            { id: 21, cat: 1, title: "Introductory Health Status", text: "First session of employer-sponsored coaching. Coach and client introduce themselves. Which additional topic is appropriate to initially discuss?", options: ["Additional worksite support", "Client’s self-assessment of health status", "SMART goals", "Work stress impact"], answer: 1, explanation: "Reviewing assessments creates a non-judgmental entry point for visioning." },
            { id: 22, cat: 1, title: "Inviting Feedback", text: "End of second session. Client summarizes takeaways. Most appropriate question to invite feedback for the coach?", options: ["How can I best support you moving forward?", "I think sessions are great, what do you think?", "If you weren't happy, you'd tell me?", "What can I do differently?"], answer: 0, explanation: "Empowers the client to collaborate on the coaching process." },
            { id: 23, cat: 5, title: "The Silent Killer", text: "According to the CDC, which risk factor for heart disease is often called a “silent killer”?", options: ["Diabetes", "High blood pressure", "Obesity", "Sedentary lifestyle"], answer: 1, explanation: "Hypertension typically has no symptoms; measurement is required." },
            { id: 24, cat: 5, title: "Alcohol SBI Benefit", text: "According to the CDC, which is most likely to decrease how much a person drinks by 25%?", options: ["Smartphone notifications", "Insurance coverage", "Community activities", "Alcohol screening and brief counseling"], answer: 3, explanation: "SBI is a preventative service that reduces excessive alcohol use." },
            { id: 25, cat: 3, title: "Agitated Pacing Step", text: "Agitated client pacing and mumbling about surgeons 'ruining his knee'. Most appropriate next step?", options: ["Ask him to compose himself", "Explore emotions and apply decisional balance", "Mirror agitation", "Recommend psychotherapy"], answer: 1, explanation: "Holding space for emotions is crucial as they influence behavior/decisions." },
            { id: 26, cat: 1, title: "Insight to Action Ride", text: "87yo woman wants to socialize but lacks transport. 'I have a friend nearby who goes to church, but I don't know who would take me.' Response?", options: ["Great start. Other ideas?", "Maybe friend can help with senior center too.", "Should we call her now?", "Would you be willing to ask your friend for a ride?"], answer: 3, explanation: "Helping client move from insight to intentional action." },
            { id: 27, cat: 4, title: "Presentation Citations", text: "Coach found online content to enhance a presentation for business owners. Most appropriate action?", options: ["Cite original works on handouts", "Use without citations", "Oral citations only", "List citations only if asked"], answer: 0, explanation: "Code of Ethics requires honoring and recognizing contributions of others." },
            { id: 28, cat: 5, title: "Metabolic Risk Increase", text: "Which risk factor is most likely increased by metabolic syndrome?", options: ["Cardiovascular disease", "COPD", "Fibromyalgia", "Rheumatoid arthritis"], answer: 0, explanation: "Metabolic syndrome increases risk for heart disease, stroke, and diabetes." },
            { id: 29, cat: 5, title: "Obesity Primary Cause", text: "Which of the following is the primary cause of overweight and obesity?", options: ["Caloric imbalance", "Comorbidities", "Economic factors", "Hereditary traits"], answer: 0, explanation: "Energy imbalance (more calories consumed than utilized) is the primary cause." },
            { id: 30, cat: 5, title: "Central Fat Distribution", text: "Excess fat in which area increases disease risk most?", options: ["Abdomen", "Hips", "Lower extremities", "Upper extremities"], answer: 0, explanation: "Abdominal obesity is linked to type 2 diabetes and cardiovascular disease." },
            { id: 31, cat: 5, title: "Anxiety Prevalence", text: "According to the APA, which is the most prevalent mental disorder among U.S. adults?", options: ["Anxiety disorder", "Bipolar disorder", "Major depressive disorder", "OCD", "PTSD"], answer: 0, explanation: "Anxiety affects nearly 30% of adults at some point in their lives." },
            { id: 32, cat: 5, title: "Sleep knowledge First", text: "43yo night shift worker sleeps inconsistently and wants weight loss help. First step?", options: ["Food journal", "Track sleep", "Feelings on meds", "Ask what she knows about sleep and weight management"], answer: 3, explanation: "Ask-Offer-Ask: Always elicit client knowledge first." },
            { id: 33, cat: 3, title: "Introductory Roles", text: "Introductory conversation for vegan diet. Client wants coach to plan menu and tell her where to shop. Next step?", options: ["Identify health food stores", "Plan a vegan menu", "Describe coaching process and roles", "Suggest research cookbooks"], answer: 2, explanation: "Clarifies expectations and responsibilities in the coaching relationship." },
            { id: 34, cat: 1, title: "Best use of time", text: "Client's son has fatal cancer. Relationship with husband is strained. She appears distressed. Approach?", options: ["Ask about husband", "Refer to therapist", "Share cancer groups", "Ask what envisions as best use of time today"], answer: 3, explanation: "Listens for what matters most to help articulate a vision." },
            { id: 35, cat: 2, title: "Confidence 6 scaling", text: "Weekly goal to walk instead of smoke. Confidence is 6/10. Response to elicit change talk?", options: ["6 is high!", "6 is good; curious how it goes.", "Adjust goal for more confidence?", "What makes it a 6 instead of a 4?"], answer: 3, explanation: "Scaling question forces client to defend their strengths/ability." },
            { id: 36, cat: 3, title: "Importance 3 scaling", text: "Importance of weight loss is 3/10. “Maybe I don’t want to lose weight.” Response?", options: ["A 3 means not ready.", "If not important, choose new goal.", "Okay to feel that way.", "What makes your rating a 3 and not a 1?"], answer: 3, explanation: "Scaling question to elicit change talk from low motivation." },
            { id: 37, cat: 3, title: "Cancer Recurrence Presence", text: "Labs show cancer recurrence. Chemotherapy required again. Client cries: “I just don’t think I can do this horrible chemo again.” Response?", options: ["Affirm strength", "Be present to hold space", "Create new goals", "Reframing"], answer: 1, explanation: "Holding space fosters trust and psychological safety." },
            { id: 38, cat: 3, title: "Self-Defeating Reflection", text: "Client is disappointed and feels like a failure with no willpower. Response to self-defeating perception?", options: ["Changing takes time.", "I hear your frustration... you feel like a failure...", "Brainstorm confidence?", "I disagree..."], answer: 1, explanation: "Reflection acknowledges the client's internal experience." },
            { id: 39, cat: 1, title: "Important vs Urgent", text: "Eager for weight loss/stress goals. Coach uses exercise to distinguish Important vs Urgent goals. Purpose?", options: ["Clarify next steps", "Define long-term goals for desired outcomes", "Explore willingness", "Identify assumptions"], answer: 1, explanation: "Clarifies direction and aligns vision with focused goals." },
            { id: 40, cat: 1, title: "SMART Goal Knowledge", text: "27yo woman will walk more next week. SMART-goal-building question?", options: ["Friend to walk with?", "How feel if you lose weight?", "How will you know when you have met your goal?", "Scale of 0-10, how pleased?"], answer: 2, explanation: "Explores the 'how' and measurability of the goal." },
            { id: 41, cat: 1, title: "Established Hours Integrity", text: "Missed session. Client asks to meet late nights or Sundays. Coach office hours are Mon-Sat 9-5. Next step?", options: ["Advise expanding hours", "Assess readiness", "Inform coaching not provided outside established hours", "Make exception"], answer: 2, explanation: "Maintains professional boundaries and integrity." },
            { id: 43, cat: 3, title: "Quit smoking impact", text: "Ready to quit smoking. Tired of smell/cost. Best response?", options: ["How impact your plan to quit?", "How many cigarettes?", "Timeline?", "Use of money saved?"], answer: 0, explanation: "Evokes deeper purpose and planning language." },
            { id: 44, cat: 5, title: "BMI 25 Classification", text: "A client has a BMI of 25 kg/m². Classification?", options: ["Underweight", "Normal", "Overweight", "Obese"], answer: 2, explanation: "Overweight category begins at BMI 25." },
            { id: 45, cat: 4, title: "Triathlete Advice Violation", text: "Coach (triathlete) recommends back exercises for leg numbness. Violation?", options: ["Accurate representation of expertise", "Balancing roles", "Conflict of interest", "Professional boundaries"], answer: 0, explanation: "Exceeds scope by giving clinical/physical therapy advice based on hobbies." },
            { id: 46, cat: 4, title: "Security Rule Safeguards", text: "Which best explains the purpose of the HIPAA Security Rule?", options: ["Defines private info", "Safeguards for electronic PHI", "Outlines provider notes", "Safety guidelines"], answer: 1, explanation: "Focuses specifically on ePHI (electronic patient health info)." },
            { id: 47, cat: 1, title: "Headset Noise Boundary", text: "Construction noise at home coach office. Most appropriate actions?", options: ["Review materials", "Silence alerts", "Take moment to focus", "Use headset and create environmental boundaries"], answer: 3, explanation: "Maintains session integrity and professional standards." },
            { id: 48, cat: 5, title: "BMI 29 Classification", text: "Client has a BMI of 29 kg/m². Classification?", options: ["Underweight", "Normal", "Overweight", "Obese"], answer: 2, explanation: "25 to <30 range is overweight." },
            { id: 49, cat: 3, title: "Stress management Past", text: "Drinks to calm nerves. Asks for coping ideas. Response?", options: ["Dangerous around kids?", "Drinking eases nerves.", "Happy you're giving it up.", "What other ways have you used in the past?"], answer: 3, explanation: "Invites exploration of past successes and coping mechanisms." },
            { id: 50, cat: 1, title: "Frustration Empathy", text: "Weight loss struggle for a lifetime. “I gain it, lose it, gain it again.” Coach: “That must be very frustrating.” Skill?", options: ["Patience", "Bottom-lining", "Eliciting motivation", "Empathizing", "Summarizing"], answer: 3, explanation: "Validates the client's emotion." },
            { id: 51, cat: 4, title: "Enterprise confidentiality", text: "HR director requests coaching content of an employee. Response?", options: ["Email summary", "Ask client permission", "Sessions are confidential", "What to know?"], answer: 2, explanation: "Upholds strict confidentiality code." },
            { id: 52, cat: 4, title: "Lock computer HIPAA", text: "Computer screen faces away, coach steps away for break. Action?", options: ["Block visitors", "Lock computer before leaving", "Remind coworkers", "No action needed"], answer: 1, explanation: "Protects PHI from unauthorized access." },
            { id: 53, cat: 3, title: "Silence processing", text: "Client mentions fitness, transport, carpooling. Coach listens quietly. Skill?", options: ["Acknowledging state", "Benevolence", "Empathy", "Using silence appropriately"], answer: 3, explanation: "Allows client time to process thoughts." },
            { id: 54, cat: 2, title: "RD Coach Collaboration", text: "Newly divorced, doesn't know how to cook. Asks for healthy meal idea. RD Coach asks to brainstorm entrée together. Concept?", options: ["Acceptance", "Autonomy", "Collaboration", "Compassion"], answer: 2, explanation: "Uses partnership to elicit client expertise." },
            { id: 55, cat: 1, title: "Committed student response", text: "Grad student can't figure out how to get things done. Initial response to words/meaning?", options: ["I went to therapy...", "Making it harder...", "Of course you're stressed...", "Resources tried?", "You are committed to your responsibilities..."], answer: 4, explanation: "Responds with warmth and presence (Affirmation)." },
            { id: 56, cat: 4, title: "Babysitting standard", text: "Cannot find babysitter for 3 kids. Coach offers to watch them. Standard violated?", options: ["Confidentiality", "Conflict of interest", "Professional boundaries", "Scope of practice"], answer: 2, explanation: "Blurring lines of dual relationships." },
            { id: 57, cat: 1, title: "Takeaway learning", text: "End of second stress session. After summary, coach asks?", options: ["How facilitate?", "Choose focus areas...", "What is one takeaway you learned?", "What concerns you?"], answer: 2, explanation: "Reinforces active learning." },
            { id: 58, cat: 3, title: "Rapid Weight Loss Motivated", text: "Wants to lose 30lbs in 5 weeks. Most appropriate response?", options: ["“I hear how motivated you are. What ideas do you have next?”", "5kg is realistic.", "Risk of regain.", "Aggressive plan."], answer: 0, explanation: "Reflects motivation and asks open question to find next steps." },
            { id: 59, cat: 4, title: "Parent update confidentiality", text: "Parents paid for 19yo coaching. Mother requests update. Next step?", options: ["Adhere to confidentiality", "Contact client permission", "Provide records", "Schedule appointment"], answer: 0, explanation: "Confidentiality remains with the client regardless of payer." },
            { id: 60, cat: 3, title: "Happy Hour Reframe", text: "Guilt over ordering drinks/dessert at happy hour. Reframe response?", options: ["Everyone makes mistakes.", "I hear frustration. What were some good choices you made last week?", "Look on bright side.", "Guilt inspires change."], answer: 1, explanation: "Validates feelings and invites positives." },
            { id: 61, cat: 1, title: "Assessment Discovery", text: "Wellness assessment completed before first session. Next step?", options: ["Advise concerns", "Align with guidelines", "Explore what client learned from assessment", "Support resources"], answer: 2, explanation: "Supports self-discovery." },
            { id: 62, cat: 3, title: "Successful life curiosity", text: "“I can lose weight, but I can’t keep it off.” Coach: “I'd like to learn more about life when you were successful.” Skill?", options: ["Attentive", "Attuned", "Curious without assuming", "Empathy"], answer: 2, explanation: "Encourages sharing past successful experiences." },
            { id: 63, cat: 4, title: "Personal Trainer Beliefs", text: "Discomfort because trainer is gay. Next step?", options: ["Acknowledge dilemma and explore alternatives", "End relationship", "Inquire about origins", "Seek peer advice"], answer: 0, explanation: "Non-judgmental approach to supporting next steps." },
            { id: 64, cat: 3, title: "Brainstorm meds", text: "“What are ways to remember to take my meds?” Response?", options: ["How often remember?", "7-day pill box.", "Lots of tools.", "Would it be helpful to brainstorm some ideas together?"], answer: 3, explanation: "Helps client explore multiple possible solutions." },
            { id: 65, cat: 1, title: "Dialysis graduation vision", text: "Fears dialysis, hopes to see great-granddaughter graduate. Visioning response?", options: ["Importance of avoiding?", "How will it feel to attend graduation?", "What know about condition?", "What happens if no change?"], answer: 1, explanation: "Connects with what matters most." },
            { id: 66, cat: 4, title: "Non-binary intake form", text: "Did not fill intake because of binary choice. “I'm not sure you're the right coach.” Step?", options: ["Acknowledge emotions and invite preferred pronouns", "Apologize/move on", "Refer", "Standard form excuse"], answer: 0, explanation: "Validates experience and supports inclusive care." },
            { id: 67, cat: 4, title: "Transitioning Discrimination", text: "Coach reacts negatively to transitioning client. Best description?", options: ["Not violation", "Anxiety concern", "Violates code - discrimination", "Violates code - scope"], answer: 2, explanation: "Refrains from discriminatory behavior." },
            { id: 68, cat: 4, title: "Oil Distributor Conflict", text: "Distributor for oils, recommends own brand without disclosing investment. Principle?", options: ["Confidentiality", "Conflict of interest", "Consent", "Boundaries"], answer: 1, explanation: "Must disclose potential conflicts of interest to stakeholders." },
            { id: 69, cat: 2, title: "Confidence increase exploration", text: "Weight plateau, cuts 200 calories, confidence is 6. Next step?", options: ["Brainstorm alternatives", "Explore what it would take to increase his confidence", "Accountability plan", "Trust client"], answer: 1, explanation: "Elicits change talk from ambivalence." },
            { id: 70, cat: 3, title: "Persistent strategy reframe", text: "Does not adhere for more than 2 weeks. “I must be lazy.” Reframe?", options: ["Consider what learned?", "No matter the setbacks, you are persistent in finding a new strategy.", "You are not giving up.", "Not lazy."], answer: 1, explanation: "Reframes in affirmative language." },
            { id: 71, cat: 1, title: "Good year vision", text: "3rd diabetes hospitalization this year. “It has been a difficult year.” Response?", options: ["Prevent another?", "Impact?", "What makes it difficult?", "What would a good year look like?"], answer: 4, explanation: "Visioning question to identify the gap." },
            { id: 72, cat: 3, title: "Success definition open", text: "“What would success look like for you in this situation?” Type of question?", options: ["Closed-ended", "Leading", "Open-ended", "Reflective"], answer: 2, explanation: "Invites exploration and definition." },
            { id: 73, cat: 5, title: "Hypertensive Crisis fair", text: "BP is 160/110 with shortness of breath. Next step?", options: ["Emergency department directly", "Family history", "Ride home", "Visit PCP within a week"], answer: 0, explanation: "HBP + symptoms = emergency." },
            { id: 74, cat: 5, title: "BMI 26 classification", text: "BMI of 26. Classification?", options: ["Underweight", "Normal", "Overweight", "Obese"], answer: 2, explanation: "25 to <30 range is overweight." },
            { id: 75, cat: 5, title: "Support divorce response", text: "Metabolic syndrome + divorce/smoking/drinking. Response?", options: ["Healthier coping?", "Physician impact?", "I hear you grieving loss. How to best support?", "Reduce alcohol?"], answer: 2, explanation: "Acknowledges hardship and invites client needs." }
        ];

        let solvedCorrect = new Set();
        let solvedWrong = new Set();
        let currentFilter = 0;
        let activeCase = null;
        let randomizedPool = [...nbhwcDataset];

        const catNames = ["", "Presence & Relations", "Behavior Change", "Skills & Tools", "Ethics & Law", "Health Science"];

        function renderGrid(data = randomizedPool) {
            const grid = document.getElementById('case-grid');
            grid.innerHTML = '';
            
            data.forEach(c => {
                const card = document.createElement('div');
                let statusClass = '';
                if(solvedCorrect.has(c.id)) statusClass = 'solved-correct opacity-60';
                else if(solvedWrong.has(c.id)) statusClass = 'solved-wrong';

                card.className = `case-card p-6 rounded-[2rem] cursor-pointer ${statusClass}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="category-tag cat-${c.cat}">${catNames[c.cat].split(' ')[0]}</span>
                        <span class="text-[10px] font-mono text-slate-700 tracking-tighter">REF-${c.id}</span>
                    </div>
                    <h3 class="font-bold text-slate-100 line-clamp-2 mb-2 leading-tight text-sm">${c.title}</h3>
                    <p class="text-slate-500 text-[10px] leading-relaxed line-clamp-2">${c.text}</p>
                `;
                card.onclick = () => openCase(c);
                grid.appendChild(card);
            });
            updateStats();
        }

        function openCase(c) {
            activeCase = c;
            const modal = document.getElementById('case-modal');
            const catTag = document.getElementById('modal-category');
            
            catTag.innerText = catNames[c.cat];
            catTag.className = `category-tag cat-${c.cat}`;
            document.getElementById('modal-id').innerText = `Board Reference: REF-${c.id}`;
            document.getElementById('modal-title').innerText = c.text;
            document.getElementById('feedback-section').classList.add('hidden');
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            c.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option-item p-5 rounded-3xl flex items-center gap-4 text-sm font-medium border-2';
                div.innerHTML = `<span class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-950 border border-slate-800 text-xs font-bold text-blue-400">${String.fromCharCode(65 + idx)}</span> ${opt}`;
                div.onclick = () => selectOption(div, idx);
                optionsContainer.appendChild(div);
            });

            modal.classList.add('active');
        }

        function selectOption(el, idx) {
            if(document.getElementById('feedback-section').classList.contains('hidden')) {
                const items = document.querySelectorAll('.option-item');
                items.forEach((item, i) => {
                    item.classList.add('disabled');
                    if (i === activeCase.answer) {
                        item.classList.add('correct');
                        item.innerHTML += `<svg class="w-5 h-5 ml-auto text-emerald-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>`;
                    } else if (i === idx) {
                        item.classList.add('wrong');
                        item.innerHTML += `<svg class="w-5 h-5 ml-auto text-rose-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`;
                    } else {
                        item.classList.add('opacity-30');
                    }
                });

                if(idx === activeCase.answer) solvedCorrect.add(activeCase.id);
                else solvedWrong.add(activeCase.id);
                
                document.getElementById('explanation-text').innerText = activeCase.explanation;
                document.getElementById('feedback-section').classList.remove('hidden');
                updateStats();
            }
        }

        function closeModal() {
            document.getElementById('case-modal').classList.remove('active');
            filterCases(currentFilter);
        }

        function shuffleBoard() {
            randomizedPool.sort(() => Math.random() - 0.5);
            filterCases(currentFilter);
        }

        function filterCases(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach((btn, i) => {
                btn.className = (i === cat) ? 
                    "filter-btn whitespace-nowrap bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-lg shadow-blue-900" : 
                    "filter-btn whitespace-nowrap bg-slate-800 text-slate-400 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:text-white transition-all";
            });
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = randomizedPool.filter(c => 
                (cat === 0 || c.cat === cat) && 
                (c.text.toLowerCase().includes(query) || (c.title && c.title.toLowerCase().includes(query)))
            );
            renderGrid(filtered);
        }

        function updateStats() {
            const correct = solvedCorrect.size;
            const wrong = solvedWrong.size;
            const totalSeen = correct + wrong;
            const accuracy = totalSeen === 0 ? 0 : Math.round((correct / totalSeen) * 100);

            document.getElementById('stat-correct').innerText = correct;
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
            document.getElementById('progress-text').innerText = `${totalSeen}/75`;
            document.getElementById('progress-fill').style.width = `${(totalSeen / 75) * 100}%`;

            const masteryContainer = document.getElementById('category-mastery');
            masteryContainer.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const catCorrect = randomizedPool.filter(c => c.cat === i && solvedCorrect.has(c.id)).length;
                const catTotal = randomizedPool.filter(c => c.cat === i).length;
                const perc = Math.round((catCorrect / catTotal) * 100) || 0;
                
                const pill = document.createElement('div');
                pill.className = `flex-shrink-0 mastery-pill bg-slate-900 border-slate-800`;
                pill.innerHTML = `<span class="w-2 h-2 rounded-full cat-${i}"></span> ${catNames[i].split(' ')[0]}: <b class="text-white ml-1">${perc}%</b>`;
                masteryContainer.appendChild(pill);
            }
        }

        function resetStats() {
            if(confirm("Reset progress for this session?")) {
                solvedCorrect.clear();
                solvedWrong.clear();
                shuffleBoard();
            }
        }

        document.getElementById('search-input').oninput = () => filterCases(currentFilter);

        window.onload = () => {
            shuffleBoard();
        };
    </script>
</body>
</html>
